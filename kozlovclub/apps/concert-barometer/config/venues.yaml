# Концертный барометр: реестр площадок (competitor panel)
#
# SEED CATEGORIES, NOT CONCLUSIONS. This file declares WHO is observed and under
# WHAT access policy. It does not declare that any of them is a competitor in any
# economic sense; that is a finding, not a configuration value.
#
# INVARIANTS ENFORCED BY THE LOADER AND BY THE DB (migration 0001):
#   * capacity may be non-null ONLY together with capacity_source_url.  (prompt: "capacity only if sourced")
#   * enabled: true requires robots_allows_crawl: true AND access_reviewed_at set.
#   * url_verified: false means nobody has confirmed the URL resolves; the fetcher
#     refuses to call it. These are seeds for a human to verify, not verified facts.
#
# Nothing here is fetched until a human runs `barometer venues review` and records
# the robots.txt and ToS outcome.

