function coinSfx() {
  const t = audioCtx().currentTime;
  tone(1318, t, 0.09, "sine", 0.35); tone(1975, t + 0.08, 0.14, "sine", 0.3);
}

/* --- отправка выигрыша в Google-таблицу клуба --- */
function reportWin(prizeName) {
  if (!WEBHOOK_URL || WEBHOOK_URL.indexOf("http") !== 0) return;
  const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
  const payload = {
    date: new Date().toISOString(),
    user_id: u.id || "",
    username: u.username ? "@" + u.username : "",
    name: [u.first_name, u.last_name].filter(Boolean).join(" "),
    prize: prizeName,
  };
  try {
    fetch(WEBHOOK_URL, {
      method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(payload),
    });
  } catch (e) {}
}

/* --- забрать приз: чат с менеджером с готовым сообщением --- */
function claimPrize(prizeName) {
  const text = encodeURIComponent("Хочу забрать свой приз: " + prizeName);
  const link = "https://t.me/" + MANAGER + "?text=" + text;
  if (tg && tg.openTelegramLink) tg.openTelegramLink(link);
  else window.open(link, "_blank");
}

/* --- утилиты дня --- */
const todayKey = () => new Date().toISOString().slice(0, 10);
function msToMidnight() {
  const n = new Date();
  const m = new Date(n); m.setHours(24, 0, 0, 0);
  return m - n;
}
const fmtHM = (ms) => {
  const h = Math.floor(ms / 3600000), m = Math.ceil((ms % 3600000) / 60000);
  return `${h} ч ${String(m).padStart(2, "0")} мин`;
};

const CONFETTI = Array.from({ length: 26 }, (_, i) => ({
  left: (i * 37) % 100, delay: (i % 9) * 0.09, dur: 1.6 + (i % 5) * 0.25,
  rot: (i * 73) % 360, color: ["#F2B93B", "#2FA6A0", "#D8503F", "#FFF3DC"][i % 4], shape: i % 3,
}));

function Kozlovsk() {
  const [tab, setTab] = useState("drum");
  const [wins, setWins] = useState([]);
  const [rot, setRot] = useState(0);
  const [spinning, setSpinning] = useState(false);
  const [prize, setPrize] = useState(null);
  const [spentToday, setSpentToday] = useState(false);
  const [left, setLeft] = useState(msToMidnight());
  const [sound, setSound] = useState(true);
  const [toast, setToast] = useState(null);
  const soundRef = useRef(true);
  const pendingRef = useRef(null);
  const tRef = useRef(null);

  /* загрузка состояния */
  useEffect(() => {
    store.get("kz_last_spin").then((v) => { if (v === todayKey()) setSpentToday(true); });
    store.get("kz_wins").then((v) => { if (v) try { setWins(JSON.parse(v)); } catch (e) {} });
    const iv = setInterval(() => setLeft(msToMidnight()), 30000);
    return () => clearInterval(iv);
  }, []);

  const showToast = (m) => {
    setToast(m);
    clearTimeout(tRef.current);
    tRef.current = setTimeout(() => setToast(null), 2600);
  };
  const toggleSound = () => {
    const v = !sound; setSound(v); soundRef.current = v;
    if (v) { audioCtx(); coinSfx(); }
  };

  const launch = (p) => {
    pendingRef.current = p;
    const wedge = p.wedges ? p.wedges[Math.floor(Math.random() * p.wedges.length)] : p.wedge;
    const jitter = (Math.random() - 0.5) * 26;
    const target = 90 - wedge * 45 + jitter;
    const current = ((rot % 360) + 360) % 360;
    const delta = ((target - current) % 360 + 360) % 360;
    const totalDeg = 5 * 360 + delta;
    setRot(rot + totalDeg);
    setSpinning(true);
    haptic("medium");
    if (soundRef.current) { thumpSfx(); scheduleTicks(totalDeg, SPIN_MS); }
  };

  const [waiting, setWaiting] = useState(false);
  const spin = async () => {
    if (spinning || prize || waiting) return;
    if (spentToday) { showToast(`Барабан уже крутили. Новый спин через ${fmtHM(left)}`); return; }
    setWaiting(true);
    haptic("light");
    let code = null;
    try {
      const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
      const r = await fetch(WEBHOOK_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "spin",
          user_id: u.id || "",
          username: u.username ? "@" + u.username : "",
          name: [u.first_name, u.last_name].filter(Boolean).join(" "),
        }),
      });
      const d = await r.json();
      if (d && d.ok && PRIZE_BY_CODE[d.prize]) code = d.prize;
    } catch (err) {}
    setWaiting(false);
    if (code) launch({ ...PRIZE_BY_CODE[code], logged: true });
    else launch({ ...rollPromo(), logged: false });
  };


  const onWheelStop = () => {
    if (!spinning) return;
    setSpinning(false);
    setTimeout(() => {
      const p = pendingRef.current;
      if (!p) return;
      const newWins = [p.keep, ...wins];
      setWins(newWins);
      setPrize(p);
      setSpentToday(true);
      if (!p.logged) reportWin(p.keep);
      store.set("kz_last_spin", todayKey());
      store.set("kz_wins", JSON.stringify(newWins));
      haptic("win");
      if (soundRef.current) jingleSfx(p.tier);
      pendingRef.current = null;
    }, 500);
  };


  return (
    <div className="kz-root">
      <style>{CSS}</style>
      <div className="fair">
        <div className="sunburst" />

        <header className="marquee">
          <div className="bulbs top">
            {Array.from({ length: 13 }).map((_, i) => <i key={i} className={i % 2 ? "b odd" : "b"} />)}
          </div>
          <div className="marquee-pre">ДЖАЗ-КЛУБ АЛЕКСЕЯ КОЗЛОВА</div>
          <h1 className="marquee-title">КОЗЛОВСК</h1>
          <div className="bulbs bot">
            {Array.from({ length: 13 }).map((_, i) => <i key={i} className={i % 2 ? "b" : "b odd"} />)}
          </div>
        </header>

        <div className="till">
          <span className="till-lb">
            {TG_NAME ? `${TG_NAME}, ` : ""}{spentToday ? `следующий спин через ${fmtHM(left)}` : "твой бесплатный спин ждёт"}
          </span>
          <button className="snd" onClick={toggleSound} title="Звук">{sound ? "🔊" : "🔇"}</button>
        </div>

        <main className="scr">
          {tab === "drum" && (
            <>
              <section className="show">
                <img src={GOAT} alt="Козлик Козловска" draggable={false}
                  className={"goat" + (spinning || waiting ? " groove" : "")} onClick={spin} />
                <div className="drum-wrap">
                  <div className="pointer-r"><div className={"pointer" + (spinning || waiting ? " tick" : "")} /></div>
                  <div className="drum-rim">
                    <div className="studs" />
                    <div className="wheel"
                      style={{ transform: `rotate(${rot}deg)`, transition: spinning ? `transform ${SPIN_MS}ms cubic-bezier(.12,.72,.16,1)` : "none" }}
                      onTransitionEnd={onWheelStop}>
                      {WEDGES.map((wd, i) => (
                        <div key={i} className={"spoke " + wd.cls} style={{ transform: `rotate(${i * 45 - 90}deg)` }}>
                          <span
                            className="wl"
                            style={{
                              transform: `translate(-50%,-50%) rotate(${-(rot + i * 45 - 90)}deg)`,
                              transition: spinning ? `transform ${SPIN_MS}ms cubic-bezier(.12,.72,.16,1)` : "none",
                            }}
                          >
                            {wd.icon && <b className="wl-ic">{wd.icon}</b>}
                            {wd.tx && <b className="wl-tx">{wd.tx}</b>}
                            {wd.num && <b className="wl-num">{wd.num}</b>}
                          </span>
                        </div>
                      ))}
                    </div>
                    <button
                      className={"hub" + (spinning || waiting ? " busy" : spentToday ? " wait" : " ready")}
                      onClick={spin}
                    >
                      {spinning || waiting ? "♪" : spentToday ? "ЗАВТРА" : "КРУТИ"}
                    </button>
                  </div>
                  <div className="drum-legs"><i/><i/></div>
                </div>
                <div className="show-say">
                  {spinning || waiting ? "≡ барабанная дробь ≡" : spentToday ? "«Отличный спин! Жду тебя завтра»" : "«Жми в центр — крутанём!»"}
                </div>
              </section>

              <div className="fine" style={{ marginTop: "14px" }}>
                {spentToday ? `новый спин через ${fmtHM(left)}` : "1 спин в день · приз выпадает всегда"}
              </div>

              <div className="board-h">ПРИЗЫ</div>
              <div className="board">
                {SPECIALS.map((s, i) => (
                  <div key={"s" + i} className={"brow " + (s.tier === "gold" ? "gold" : "teal")}>
                    <span className="brow-t">{s.icon} {s.title}</span>
                    <span className="brow-dots" />
                    <span className="brow-o">{s.pool}</span>
                  </div>
                ))}
                <div className="brow">
                  <span className="brow-t">🎟 Промокоды −30%, −50% и −70% на билеты</span>
                </div>
              </div>
              
            </>
          )}

          {tab === "wins" && (
            <>
              <div className="board-h">МОИ ПРИЗЫ</div>
              {wins.length === 0 && <p className="lede">Пока пусто — крути барабан! Один бесплатный спин каждый день.</p>}
              {wins.length > 0 && <p className="lede">Жми «Забрать приз» — откроется чат с менеджером клуба, сообщение уже готово, просто отправь его.</p>}
              {wins.map((w, i) => (
                <div key={i} className="wincard">
                  <span className="wincard-ic">🎁</span>
                  <span className="wincard-t">{w}</span>
                  <button className="wincard-btn" onClick={() => claimPrize(w)}>ЗАБРАТЬ ПРИЗ</button>
                </div>
              ))}
            </>
          )}

          {tab === "rules" && (
            <>
              <div className="board-h">ПРАВИЛА</div>
              <div className="rule"><b>1.</b> Каждый день — один бесплатный спин барабана.</div>
              <div className="rule"><b>2.</b> Приз выпадает всегда — как минимум промокод −30%, −50% или −70% на любой билет. Коды одноразовые, действуют 7 дней.</div>
              <div className="rule"><b>3.</b> Специальные призы выпадают прямо на барабане: 🍸 коктейль от шефа — раз в день, 🎫 сертификат на двоих — раз в неделю, 👑 Золотой билет (месяц бесплатных концертов) — раз в месяц. Кому повезёт — решает случай.</div>
              <div className="rule"><b>4.</b> Забрать приз просто: вкладка «Призы» → кнопка «Забрать приз» → отправь менеджеру клуба готовое сообщение.</div>
              <div className="rule"><b>5.</b> Обладателей 👑 и 🎫 поздравляем в Telegram-канале клуба и со сцены.</div>
              <div className="rule"><b>6.</b> Клуб Алексея Козлова · Маросейка 9/2 · 4 сцены.</div>
            </>
          )}
        </main>

        <nav className="nav">
          {[["drum", "БАРАБАН"], ["wins", "ПРИЗЫ"], ["rules", "ПРАВИЛА"]].map(([k, lb]) => (
            <button key={k} className={"nav-b" + (tab === k ? " on" : "")} onClick={() => setTab(k)}>{lb}</button>
          ))}
        </nav>

        {prize && (
          <div className="veil" onClick={() => setPrize(null)}>
            <div className="confetti">
              {CONFETTI.map((c, i) => (
                <i key={i} style={{ left: c.left + "%", animationDelay: c.delay + "s", animationDuration: c.dur + "s",
                  background: c.color, transform: `rotate(${c.rot}deg)`, borderRadius: c.shape === 2 ? "50%" : "2px" }} />
              ))}
            </div>
            <div className={"prize " + prize.tier} onClick={(e) => e.stopPropagation()}>
              <div className="prize-star">{prize.icon || "🎟"}</div>
              <div className="prize-pre">{prize.tier === "gold" ? "★ ГЛАВНЫЙ ПРИЗ ★" : prize.icon === "🍸" ? "★ ПРИЗ ДНЯ ★" : "★ ВЫИГРЫШ ★"}</div>
              <div className="prize-title">{prize.title}</div>
              <div className="prize-sub">{prize.sub}</div>
              <div className="prize-note">Забрать — во вкладке «Призы»: кнопка откроет чат с менеджером клуба 💬</div>
              <button className="spin-btn slim" onClick={() => setPrize(null)}>ЗАБРАТЬ</button>
            </div>
          </div>
        )}

        {toast && <div className="toast">{toast}</div>}
      </div>
    </div>
  );
}

const CSS = `

  --brown:#4A2F17; --brown2:#6B4726;
  --gold:#F2B93B; --gold-deep:#C98A1B;
  --teal:#2FA6A0; --teal-deep:#1F7C77;
  --brick:#D8503F; --brick-deep:#B03A2C;
}

  min-height:100vh; padding:12px 8px 8px;

}

.marquee{
  position:relative; margin:14px 16px 8px; padding:17px 14px 19px;

  border-radius:16px; text-align:center;
  box-shadow:0 4px 0 rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,246,228,.15);
  z-index:2;
}
.marquee-pre{font-family:'Oswald'; font-size:9.5px; font-weight:600; letter-spacing:.32em; color:var(--gold); margin-bottom:2px;}

  display:flex; align-items:center; gap:8px; justify-content:center;
  margin:2px 14px 0; z-index:2; position:relative;
}
.till-lb{font-family:'Oswald'; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--brown2); text-align:center;}

.spin-btn:active{transform:translateY(4px); box-shadow:0 2px 0 var(--brown);}
.spin-btn.off{opacity:.6; pointer-events:none;}
.spin-btn.slim{padding:12px; font-size:14px; margin:0;}

.fine{
  text-align:center; font-family:'Oswald'; font-size:9.5px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--brown2); margin-bottom:12px; opacity:.85;
}
.fine.tall{margin-top:10px; line-height:1.9;}

.board-h{
  display:flex; align-items:center; gap:10px; justify-content:center;
  font-family:'Prosto One'; font-size:13px; color:var(--brown);
  margin:18px 0 10px; text-align:center;
}
.board-h::before,.board-h::after{content:""; flex:1; height:3px; background:var(--brown); border-radius:2px; opacity:.85;}
.board{
  background:var(--cream-hi); border:3px solid var(--brown); border-radius:16px;
  padding:6px 14px; box-shadow:0 5px 0 rgba(74,47,23,.85);
}
.brow{display:flex; align-items:baseline; gap:8px; padding:9px 0; border-bottom:2px dotted rgba(74,47,23,.25);}
.brow:last-child{border-bottom:none;}
.brow-t{font-weight:800; font-size:13px;}
.brow.gold .brow-t,.brow.gold .brow-o{color:var(--brick-deep);}
.brow.teal .brow-t,.brow.teal .brow-o{color:var(--teal-deep);}
.brow-dots{flex:1; border-bottom:2px dotted rgba(74,47,23,.35); transform:translateY(-3px); min-width:12px;}
.brow-o{font-family:'Prosto One'; font-size:13px;}

.rule{
  background:var(--cream-hi); border:3px solid var(--brown); border-radius:14px;
  padding:12px 14px; margin-bottom:10px; box-shadow:0 4px 0 rgba(74,47,23,.85);
  font-weight:700; font-size:13px; line-height:1.55;
}
.rule b{color:var(--brick-deep);}

.wincard{
  display:flex; align-items:center; gap:10px;
  background:var(--cream-hi); border:3px dashed var(--gold-deep); border-radius:14px;
  padding:12px 14px; margin-bottom:10px;
}
.wincard-ic{font-size:19px;}
.wincard-t{flex:1; font-weight:800; font-size:13.5px;}
.prize-note{
  font-size:12px; font-weight:700; line-height:1.5; color:var(--teal-deep);
  background:rgba(47,166,160,.1); border:2px dashed var(--teal);
  border-radius:10px; padding:9px 12px; margin:-6px 0 16px;
}
.wincard-btn{
  font-family:'Prosto One'; font-size:11px; letter-spacing:.1em;
  background:var(--brown); color:var(--cream-hi); border:none; border-radius:9px;
  padding:8px 13px; cursor:pointer;
}

.nav{
  position:absolute; bottom:0; left:0; right:0; z-index:6;
  display:flex; gap:8px; padding:9px 12px calc(12px + env(safe-area-inset-bottom, 0px));
  background:var(--brown);
}
.nav-b{
  flex:1; font-family:'Prosto One'; font-size:12px; letter-spacing:.08em;
  padding:12px 0; border-radius:12px; cursor:pointer;
  background:transparent; color:rgba(255,246,228,.6);
  border:2px dashed rgba(255,246,228,.35);
  transition:all .15s;
}
.nav-b.on{background:var(--gold); color:var(--brown); border:2px solid var(--brown); box-shadow:0 3px 0 rgba(0,0,0,.35);}

.veil{
  position:absolute; inset:0; z-index:20;
  background:rgba(42,27,14,.72);
  display:flex; align-items:center; justify-content:center;
}
.prize{
  position:relative; width:80%; text-align:center;
  background:var(--cream-hi); border:3px solid var(--brown); border-radius:20px;
  padding:22px 20px 20px;
  box-shadow:0 8px 0 var(--brown), 0 30px 70px rgba(0,0,0,.55);
  animation:bounceIn .45s cubic-bezier(.2,1.6,.4,1);
}
.prize.gold{border-color:var(--gold-deep); box-shadow:0 8px 0 var(--gold-deep), 0 0 70px rgba(242,185,59,.55), 0 30px 70px rgba(0,0,0,.55);}
@keyframes bounceIn{from{transform:scale(.6); opacity:0;} to{transform:scale(1); opacity:1;}}
.prize-star{font-size:44px; margin-bottom:6px;}
.prize-pre{font-family:'Oswald'; font-weight:600; font-size:10px; letter-spacing:.32em; color:var(--brick-deep); margin-bottom:6px;}
.prize-title{font-family:'Prosto One'; font-size:23px; line-height:1.2; margin-bottom:5px;}
.prize.gold .prize-title{color:var(--gold-deep);}
.prize-sub{font-family:'Oswald'; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--brown2); margin-bottom:16px;}

.confetti{position:absolute; inset:0; overflow:hidden; pointer-events:none;}
.confetti i{position:absolute; top:-14px; width:10px; height:14px; animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg); opacity:.9;}}

.toast{
  position:absolute; bottom:84px; left:50%; transform:translateX(-50%); z-index:30;
  background:var(--brown); color:var(--cream-hi);
  font-family:'Prosto One'; font-size:11.5px; letter-spacing:.04em;
  padding:11px 16px; border-radius:12px;
  box-shadow:0 4px 0 rgba(0,0,0,.35);
  animation:bounceIn .25s ease; white-space:nowrap; max-width:92%;
}

@media (prefers-reduced-motion: reduce){
  .sunburst,.b,.goat,.pointer.tick{animation:none;}
  .confetti i{animation:none; opacity:0;}
}
`;

ReactDOM.createRoot(document.getElementById("root")).render(<Kozlovsk />);
</script>
</body>
</html>
