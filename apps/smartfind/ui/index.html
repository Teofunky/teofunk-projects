<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>SmartFind</title>
<style>
:root{--bg:#f5f4f1;--panel:#fff;--text:#1d1d1f;--muted:#76767c;--line:#e2e0db;--accent:#b8492a;--sel:#f8e9e3;--chip:#ebe8e2;--danger:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1d;--panel:#252528;--text:#f1f1f2;--muted:#9b9ba1;--line:#38383c;--accent:#ff8b62;--sel:#3b2a24;--chip:#2f2f33;--danger:#e0533f}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column}
header{padding:16px 16px 8px}
.search{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.search:focus-within{border-color:var(--accent)}
.search svg{flex:none;color:var(--muted)}
#q{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:18px;-webkit-user-select:text;user-select:text}
#q::placeholder{color:var(--muted)}
.status{margin-top:8px;color:var(--muted);font-size:12.5px;min-height:20px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.status b{color:var(--text);font-weight:600}
.chip{background:var(--chip);border-radius:6px;padding:1px 7px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.warn{color:var(--accent)}
.spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
main{flex:1;overflow:auto;padding:0 8px 10px}
.row{display:flex;gap:12px;align-items:center;padding:6px 8px;border-radius:9px}
.row.sel{background:var(--sel)}
.thumb{width:46px;height:46px;flex:none;border-radius:7px;background:var(--chip);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:21px}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.meta{flex:1;min-width:0}
.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.labels,.why{color:var(--accent)}
.labels{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:4px;visibility:hidden}
.row:hover .acts,.row.sel .acts{visibility:visible}
button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:6px;padding:3px 9px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.divider{margin:12px 8px 4px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.empty{padding:36px 20px;color:var(--muted);text-align:center;line-height:1.7}
.excols{display:flex;gap:40px;justify-content:center;margin-top:14px;text-align:left}
.excols b{color:var(--text);font-weight:600}
.ex{color:var(--text);cursor:pointer}
.ex:hover{color:var(--accent)}
#undoBox{margin-top:22px}
.ctool{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:2px 8px 8px}
.ctool .note{color:var(--muted);font-size:12px;flex-basis:100%;margin-top:2px}
.ck{width:16px;height:16px;flex:none;accent-color:var(--accent);margin:0}
.dest{flex:none;max-width:280px;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.dest select{max-width:250px;font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:6px;padding:2px 4px}
.keybox{max-width:440px;margin:40px auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.keybox h3{margin:0 0 6px;font-size:16px}
.keybox p{margin:0 0 12px;color:var(--muted);font-size:13px}
.keybox input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;margin-bottom:10px;-webkit-user-select:text;user-select:text}
#keyerr{color:var(--accent);font-size:12px;min-height:16px}
footer{padding:7px 16px;color:var(--muted);font-size:11.5px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:6px 12px;border-radius:8px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:.92}
</style>
</head>
<body>
<header>
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" autofocus autocomplete="off" spellcheck="false" placeholder="Найди или убери: «фотка с гитарой на сцене», «разбери загрузки»">
  </div>
  <div class="status" id="status"></div>
</header>
<main id="list"></main>
<footer><span id="hints"></span><span id="timing"></span></footer>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const api = () => window.pywebview.api;
let mode = 'search', items = [], display = [], sel = 0, sid = null, seq = 0, lastQuery = '', labels = {}, topCount = -1;
let C = null, armTimer = null;
const thumbCache = new Map();
let thumbQueue = [], thumbActive = 0;

const FIND_EX = ['фотка с гитарой на сцене прошлой осенью', 'договор с артистом за октябрь', 'чем можно смонтировать видео', 'скриншоты за вчера'];
const CLEAN_EX = ['разбери загрузки и рабочий стол по папкам', 'что занимает больше всего места', 'найди дубли фоток', 'убери установщики и мусор'];
const HINTS = {
  search: 'Enter: искать / открыть · ⌘Enter: показать в Finder · ↑↓: выбор · Esc: очистить',
  cleanup: 'Галочки и папку можно менять в каждой строке · ничего не удаляется, только перемещается · Esc: выйти'
};

function esc(s){return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function icon(it){return it.is_app?'🧩':it.is_dir?'📁':it.is_image?'🖼️':'📄'}
function setStatus(html){$('#status').innerHTML = html}
function setMode(m){ mode = m; $('#hints').textContent = HINTS[m]; }
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),1600)}
function humanBytes(n){const u=['Б','КБ','МБ','ГБ'];let i=0;while(n>=1024&&i<3){n/=1024;i++}return (i?n.toFixed(1):n.toFixed(0))+' '+u[i]}
window.focusSearch = () => { const q=$('#q'); q.focus(); q.select(); };

async function showEmpty(){
  const ex = e => '<span class="ex" data-q="'+esc(e)+'">«'+esc(e)+'»</span>';
  $('#list').innerHTML = '<div class="empty">Пиши как человеку: что ищешь или что убрать.' +
    '<div class="excols"><div><b>Найти</b><br>' + FIND_EX.map(ex).join('<br>') + '</div>' +
    '<div><b>Убрать</b><br>' + CLEAN_EX.map(ex).join('<br>') + '</div></div><div id="undoBox"></div></div>';
  try {
    const hist = await api().history();
    const p = (hist || []).find(x => !x.undone);
    if (p && $('#undoBox')) $('#undoBox').innerHTML = '<button id="undoLast" data-run="'+esc(p.run_id)+'">Отменить последнюю уборку ('+p.count+' шт., '+esc(p.run_id)+')</button>';
  } catch (e) {}
}

function showKey(err){
  setStatus('');
  $('#list').innerHTML = `<div class="keybox"><h3>Ключ Claude API</h3>
    <p>Нужен ключ из Claude Console (раздел API Keys). Хранится в Связке ключей macOS, никуда кроме Anthropic не отправляется.</p>
    <input id="key" type="password" placeholder="sk-ant-..." autocomplete="off">
    <div style="display:flex;gap:8px;align-items:center"><button class="primary" id="savekey">Сохранить</button><span id="keyerr">${esc(err||'')}</span></div></div>`;
  const k = $('#key'); k.focus();
  const save = async () => {
    const r = await api().save_key(k.value);
    if (r.ok) { toast('Ключ сохранён'); showEmpty(); window.focusSearch(); if ($('#q').value.trim()) doSearch(); }
    else $('#keyerr').textContent = r.error;
  };
  $('#savekey').onclick = save;
  k.addEventListener('keydown', e => { if (e.key === 'Enter') { e.stopPropagation(); e.preventDefault(); save(); } });
}

/* ---------- превью ---------- */
function loadThumb(it, el){
  if (!it || !el) return;
  if (thumbCache.has(it.path)) { setThumb(el, thumbCache.get(it.path)); return; }
  thumbQueue.push([it, el]); pumpThumbs();
}
function pumpThumbs(){
  while (thumbActive < 4 && thumbQueue.length) {
    const [it, el] = thumbQueue.shift(); thumbActive++;
    api().thumb(it.path).then(d => { thumbCache.set(it.path, d); if (el.isConnected) setThumb(el, d); })
      .catch(() => {}).finally(() => { thumbActive--; pumpThumbs(); });
  }
}
function setThumb(el, d){ if (d) el.innerHTML = '<img src="' + d + '">'; }

/* ---------- выбор строк ---------- */
function rowsDom(){ return [...document.querySelectorAll('.row')]; }
function current(){ return mode === 'cleanup' ? (C && C.rows[sel]) : display[sel]; }
function select(i, scroll = true){
  sel = i;
  rowsDom().forEach(r => r.classList.toggle('sel', +r.dataset.i === sel));
  if (scroll) { const r = document.querySelector('.row.sel'); if (r) r.scrollIntoView({block:'nearest'}); }
}
function move(d){
  const rs = rowsDom(); if (!rs.length) return;
  let pos = rs.findIndex(r => +r.dataset.i === sel);
  pos = pos < 0 ? 0 : Math.max(0, Math.min(rs.length - 1, pos + d));
  select(+rs[pos].dataset.i);
}
function act(a, it){
  if (!it) return;
  if (a === 'open') api().open_item(it.path);
  else if (a === 'reveal') api().reveal_item(it.path);
  else if (a === 'copy') { api().copy_item(it.path); toast('Путь скопирован'); }
}

/* ---------- поиск ---------- */
function statusLine(res, extra){
  let h = '<b>' + esc(res.intent || 'Поиск') + '</b>';
  (res.chips || []).forEach(c => h += '<span class="chip">' + esc(c) + '</span>');
  h += '<span>· ' + res.items.length + ' найдено</span>';
  if (res.loose) h += '<span class="warn">· точных совпадений нет, показываю близкое</span>';
  return h + (extra || '');
}

function rowHtml(it, i){
  const lab = labels[it.path];
  return `<div class="row${i===sel?' sel':''}" data-i="${i}">
    <div class="thumb">${icon(it)}</div>
    <div class="meta"><div class="name">${esc(it.name)}</div>
      <div class="sub">${esc(it.dir)} · ${esc(it.date)}${it.size?' · '+esc(it.size):''} · ${esc(it.kind)}</div>
      ${lab && lab.length ? '<div class="labels">на фото: '+esc(lab.join(', '))+'</div>' : ''}</div>
    <div class="acts"><button data-a="open">Открыть</button><button data-a="reveal">В Finder</button><button data-a="copy">Путь</button></div>
  </div>`;
}

function renderList(){
  thumbQueue = [];
  if (!display.length) { $('#list').innerHTML = '<div class="empty">Ничего не нашлось. Попробуй описать иначе: другое слово, примерная дата, тип файла.</div>'; return; }
  let html = '';
  display.forEach((it, i) => {
    if (topCount >= 0 && i === topCount) html += '<div class="divider">Менее вероятно</div>';
    html += rowHtml(it, i);
  });
  $('#list').innerHTML = html;
  rowsDom().forEach(row => loadThumb(display[+row.dataset.i], row.querySelector('.thumb')));
}

async function doSearch(){
  const q = $('#q').value.trim();
  if (!q) return;
  const my = ++seq; lastQuery = q; labels = {}; topCount = -1; sel = 0; C = null;
  setMode('search');
  setStatus('<span class="spin"></span> Claude разбирает запрос…');
  $('#list').innerHTML = ''; $('#timing').textContent = '';
  let res;
  try { res = await api().search(q); } catch (e) { res = {error: String(e)}; }
  if (my !== seq) return;
  if (res.error) {
    if (res.error === 'NO_KEY' || res.error.includes('401')) { showKey(res.error === 'NO_KEY' ? '' : res.error); return; }
    setStatus('<span class="warn">Ошибка: ' + esc(res.error) + '</span>'); return;
  }
  $('#timing').textContent = 'план ' + ((res.plan_ms||0)/1000).toFixed(1) + ' с · ' + (res.mode === 'cleanup' ? 'разбор ' : 'поиск ') + ((res.search_ms||0)/1000).toFixed(1) + ' с';
  if (res.mode === 'cleanup') { startCleanup(res); return; }

  sid = res.id; items = res.items || []; display = items.slice();
  const fileCount = items.filter(i => !i.is_app).length;
  setStatus(statusLine(res, fileCount >= 4 ? ' <span class="spin"></span><span>уточняю порядок…</span>' : ''));
  renderList();
  if (fileCount < 4) return;
  let r = {};
  try { r = await api().rerank(sid); } catch (e) { r = {}; }
  if (my !== seq) return;
  setStatus(statusLine(res, ''));
  labels = (r && r.labels) || {};
  if (r && r.top && r.top.length) {
    const apps = items.filter(i => i.is_app);
    const byPath = new Map(items.map(i => [i.path, i]));
    const top = r.top.map(p => byPath.get(p)).filter(Boolean);
    const topSet = new Set(r.top);
    const rest = items.filter(i => !i.is_app && !topSet.has(i.path));
    display = apps.concat(top, rest);
    topCount = rest.length ? apps.length + top.length : -1;
  }
  sel = 0; renderList();
}

/* ---------- уборка ---------- */
function startCleanup(res){
  setMode('cleanup');
  C = {sid: res.id, rows: res.rows || [], targets: res.targets || [], note: res.note || '', res, runs: {}, armed: false, extra: ''};
  sel = C.rows.length ? C.rows[0].id : 0;
  setStatus(cleanupStatus());
  renderCleanup();
}
function liveRows(){ return C.rows.filter(r => !r.done); }
function checkedRows(){ return C.rows.filter(r => r.checked && !r.done && r.target); }
function cleanupStatus(){
  let h = '<b>' + esc(C.res.intent || 'Уборка') + '</b>';
  (C.res.chips || []).forEach(c => h += '<span class="chip">' + esc(c) + '</span>');
  h += '<span>· в списке ' + liveRows().length + '</span>';
  return h + C.extra;
}
function applyLabel(){
  const c = checkedRows();
  return c.length ? `Переместить ${c.length} (${humanBytes(c.reduce((s, r) => s + (r.bytes || 0), 0))})` : 'Ничего не отмечено';
}
function targetControl(r){
  if (C.targets.length) {
    let o = '<option value="">оставить на месте</option>';
    C.targets.forEach(t => o += `<option value="${esc(t.path)}"${t.path === r.target ? ' selected' : ''}>${esc(t.label)}</option>`);
    return `<select class="tg">${o}</select>`;
  }
  return r.target ? '_На удаление' : 'оставить';
}
function crowHtml(r){
  return `<div class="row crow${r.id===sel?' sel':''}" data-i="${r.id}">
    <input type="checkbox" class="ck"${r.checked && r.target ? ' checked' : ''}${r.target ? '' : ' disabled'}>
    <div class="thumb">${icon(r)}</div>
    <div class="meta"><div class="name">${esc(r.name)}</div>
      <div class="sub">${esc(r.dir)} · ${esc(r.date)} · ${esc(r.size)}${r.reason ? ' · <span class="why">' + esc(r.reason) + '</span>' : ''}</div></div>
    <div class="dest">→ ${targetControl(r)}</div>
    <div class="acts"><button data-a="reveal">В Finder</button></div>
  </div>`;
}
function renderCleanup(){
  thumbQueue = [];
  if (!liveRows().length) { $('#list').innerHTML = '<div class="empty">' + esc(C.note || 'Убирать нечего.') + '</div>'; return; }
  let html = `<div class="ctool"><button class="primary" id="apply"${checkedRows().length ? '' : ' disabled'}>${esc(applyLabel())}</button>` +
    `<button id="selAll">Отметить всё</button><button id="selNone">Снять всё</button><div class="note">${esc(C.note)}</div></div>`;
  let lastGroup = null;
  C.rows.forEach(r => {
    if (r.done) return;
    if (r.group !== null && r.group !== undefined && r.group !== lastGroup) {
      const n = C.rows.filter(x => x.group === r.group && !x.done).length;
      html += `<div class="divider">Одинаковые файлы · ${n} шт. по ${esc(r.size)}</div>`;
      lastGroup = r.group;
    }
    html += crowHtml(r);
  });
  $('#list').innerHTML = html;
  rowsDom().forEach(row => loadThumb(C.rows[+row.dataset.i], row.querySelector('.thumb')));
  $('#apply').onclick = onApply;
  $('#selAll').onclick = () => setAll(true);
  $('#selNone').onclick = () => setAll(false);
}
function setAll(v){
  C.rows.forEach(r => { if (!r.done && r.target && !(v && r.keeper)) r.checked = v; });
  renderCleanup();
}
function disarm(){
  clearTimeout(armTimer);
  if (!C) return;
  C.armed = false;
  const b = $('#apply');
  if (b) { b.classList.remove('armed'); b.textContent = applyLabel(); b.disabled = !checkedRows().length; }
}
async function onApply(){
  const picked = checkedRows();
  if (!picked.length) return;
  const b = $('#apply');
  if (!C.armed) {
    C.armed = true; b.classList.add('armed');
    b.textContent = `Точно переместить ${picked.length}? Нажми ещё раз`;
    armTimer = setTimeout(disarm, 4000);
    return;
  }
  clearTimeout(armTimer); C.armed = false;
  b.disabled = true; b.textContent = 'Перемещаю…';
  let res;
  try { res = await api().apply_cleanup(C.sid, picked.map(r => ({id: r.id, target: r.target}))); } catch (e) { res = {error: String(e)}; }
  if (res.error) { setStatus('<span class="warn">Ошибка: ' + esc(res.error) + '</span>'); disarm(); return; }
  (res.moved_ids || []).forEach(id => { C.rows[id].done = true; });
  if (res.run_id) C.runs[res.run_id] = res.moved_ids || [];
  C.extra = ` <span>· перемещено ${res.moved} (${esc(res.bytes)})</span>`;
  if (res.failed && res.failed.length) C.extra += ` <span class="warn" title="${esc(res.failed.map(f => f.name + ': ' + f.error).join('\n'))}">· не удалось: ${res.failed.length}</span>`;
  if (res.run_id) C.extra += ` <button class="undo" data-run="${esc(res.run_id)}">Отменить</button>`;
  setStatus(cleanupStatus());
  toast(res.moved ? `Перемещено: ${res.moved}` : 'Ничего не перемещено');
  renderCleanup();
}
async function doUndo(runId){
  let r;
  try { r = await api().undo(runId || null); } catch (e) { r = {error: String(e)}; }
  if (r.error) { toast(r.error); return; }
  toast(`Вернул на место: ${r.restored}` + (r.failed && r.failed.length ? `, не вышло: ${r.failed.length}` : ''));
  if (mode === 'cleanup' && C && runId && C.runs[runId]) {
    C.runs[runId].forEach(id => { C.rows[id].done = false; });
    delete C.runs[runId];
    C.extra = ` <span>· уборка отменена, вернул ${r.restored}</span>`;
    setStatus(cleanupStatus()); renderCleanup();
  } else if (mode === 'search' && !display.length) {
    showEmpty();
  }
}

/* ---------- события ---------- */
$('#list').addEventListener('click', e => {
  const ex = e.target.closest('.ex');
  if (ex) { $('#q').value = ex.dataset.q; doSearch(); return; }
  if (e.target.id === 'undoLast') { doUndo(e.target.dataset.run); return; }
  const row = e.target.closest('.row'); if (!row) return;
  select(+row.dataset.i, false);
  const b = e.target.closest('button'); if (b) act(b.dataset.a, current());
});
$('#list').addEventListener('dblclick', e => {
  if (e.target.closest('button,input,select')) return;
  const row = e.target.closest('.row'); if (row) { select(+row.dataset.i, false); act('open', current()); }
});
$('#list').addEventListener('change', e => {
  if (mode !== 'cleanup' || !C) return;
  const row = e.target.closest('.row'); if (!row) return;
  const r = C.rows[+row.dataset.i];
  if (e.target.classList.contains('ck')) r.checked = e.target.checked;
  else if (e.target.classList.contains('tg')) {
    r.target = e.target.value; r.checked = !!r.target;
    const ck = row.querySelector('.ck'); ck.disabled = !r.target; ck.checked = r.checked;
  }
  disarm();
});
$('#status').addEventListener('click', e => {
  const b = e.target.closest('button.undo'); if (b) doUndo(b.dataset.run);
});

document.addEventListener('keydown', e => {
  const ae = document.activeElement;
  if (ae && ae.id === 'key') return;
  if (e.key === 'ArrowDown') { move(1); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { move(-1); e.preventDefault(); }
  else if (e.key === ' ' && mode === 'cleanup' && ae && ae.tagName !== 'INPUT' && ae.tagName !== 'SELECT') {
    const r = current();
    if (r && r.target && !r.done) { r.checked = !r.checked; const ck = document.querySelector('.row.sel .ck'); if (ck) ck.checked = r.checked; disarm(); }
    e.preventDefault();
  }
  else if (e.key === 'Enter') {
    if (ae && ae.tagName === 'SELECT') return;
    e.preventDefault();
    const q = $('#q').value.trim();
    if (q && q !== lastQuery) doSearch();
    else if (mode === 'search' && !display.length && q) doSearch();
    else if (current()) {
      if (e.metaKey) act('reveal', current());
      else if (mode === 'search') act('open', current());
    }
  }
  else if (e.key === 'Escape') {
    $('#q').value = ''; lastQuery = ''; display = []; C = null; seq++;
    setMode('search'); setStatus(''); showEmpty(); window.focusSearch();
  }
});

setMode('search');
window.addEventListener('pywebviewready', async () => {
  showEmpty(); window.focusSearch();
  try { const s = await api().status(); if (!s.has_key) showKey(); } catch (e) {}
});
</script>
