<title>Guitar Tone Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: tech-noir konzola – 3D showroom hore, pod ním pracovná plocha (gitara + zvuk) a ovládací panel vpravo */
:root{
  --bg:#2a2f37; --bg2:#1d2128; --panel:rgba(30,35,44,.74); --panel-solid:#1f242c; --raise:rgba(255,255,255,.05);
  --line:rgba(205,215,230,.14); --line2:rgba(205,215,230,.26);
  --fg:#f1f4f8; --muted:#b3bcc8; --dim:#7f8a99;
  --acc:#3ee6ff; --acc-ink:#021015; --acc-soft:rgba(62,230,255,.12); --acc-glow:rgba(62,230,255,.32);
  --acc2:#8f7dff; --sig:#ffb547;
  --tS:#3ee6ff; --tH:#a593ff; --tP:#ffb547;
  --amber:var(--acc); --pink:var(--acc2); --sky:var(--acc); --mint:#45f0b4; --mustard:var(--sig);
  --display:"Righteous","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{
  color:var(--fg); font-family:var(--body); font-size:15px; line-height:1.5; font-weight:500;
  background:
    radial-gradient(1000px 520px at 12% -12%, rgba(62,230,255,.12), transparent 62%),
    radial-gradient(900px 600px at 105% 8%, rgba(143,125,255,.12), transparent 60%),
    linear-gradient(rgba(220,228,240,.045) 1px, transparent 1px) 0 0/44px 44px,
    linear-gradient(90deg, rgba(220,228,240,.045) 1px, transparent 1px) 0 0/44px 44px,
    linear-gradient(165deg,#4a515c 0%,#343a43 38%,#2a2f37 70%,#30353e 100%) fixed,
    var(--bg);
  min-height:100%;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:20px 48px;
}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:4px 2px}
.pick{width:40px;height:40px;flex:none;filter:drop-shadow(0 0 10px var(--acc-glow))}
.langs{margin-left:auto;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:3px;backdrop-filter:blur(10px)}
.langs button{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.08em;border:0;border-radius:7px;padding:6px 12px;cursor:pointer;background:transparent;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.4vw,36px);margin:0;letter-spacing:.1em;text-transform:uppercase;line-height:1.15;
  background:linear-gradient(90deg,#fff 0%,#cfe9f2 55%,var(--acc) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:4px 0 0;color:var(--muted);max-width:66ch;font-size:14px}

.chips{display:flex;gap:6px;margin-top:2px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:6px;background:transparent;border:1px solid currentColor}
.chip.S{color:var(--tS)}.chip.H{color:var(--tH)}.chip.P{color:var(--tP)}

/* glass panels */
.box{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 24px 50px -30px rgba(0,0,0,.8)}
.bench{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:18px;align-items:start}
@media (max-width:960px){.bench{grid-template-columns:minmax(0,1fr)}}
.stage{background:radial-gradient(70% 70% at 45% 50%, rgba(62,230,255,.07), transparent 70%), var(--panel);display:flex;flex-direction:column;gap:12px}
.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.stage-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.1em;text-transform:uppercase}
.stage-head span{color:var(--muted);font-size:12.5px;font-family:var(--mono);display:block;margin-top:4px}
.stage-head{align-items:flex-start}
.wnotes{margin:0;padding:12px 14px 12px 30px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);background:var(--raise);border:1px solid var(--line);border-radius:12px}
.wnotes b{color:var(--fg);font-weight:800}
.flow{animation:flow .8s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
#guitar{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 18px 22px rgba(0,0,0,.55))}
.hint{color:var(--muted);font-size:13px;margin:0}
.credit{color:var(--dim);font-size:11px;margin:0;font-family:var(--mono)}.credit a{color:var(--muted)}
.pu{cursor:pointer;outline:none}
.pu:focus-visible .puhit{stroke:#fff;stroke-opacity:.6;stroke-width:2;stroke-dasharray:5 4}
.pu:hover .puhit{stroke:#fff;stroke-opacity:.45}

h3{font-family:var(--display);font-weight:400;font-size:15px;margin:0;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
h3 i{width:6px;height:16px;border-radius:2px;display:inline-block;font-style:normal;box-shadow:0 0 10px currentColor}
.lab{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);font-weight:700}
.why{font-size:12.5px;color:var(--muted);margin:0}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font-family:var(--body);font-weight:700;font-size:13.5px;color:var(--fg);background:var(--raise);border:1px solid var(--line2);border-radius:9px;padding:7px 12px;cursor:pointer;transition:background .15s,border-color .15s,color .15s,box-shadow .15s}
.seg button:hover{border-color:rgba(62,230,255,.5);color:#fff}
.seg button[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);box-shadow:0 0 16px -4px var(--acc-glow)}
.seg.sm button{font-size:12.5px;padding:5px 10px;border-radius:8px}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.selector{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.selector .lab{margin-right:6px}
.selector button{font-family:var(--body);font-weight:700;font-size:13px;color:var(--fg);background:var(--raise);border:1px solid var(--line2);border-radius:9px;padding:7px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:border-color .15s,background .15s}
.selector button:hover{border-color:rgba(62,230,255,.5)}
.selector button[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:#fff;box-shadow:0 0 16px -4px var(--acc-glow)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block}
.selector button[aria-pressed="true"] .dot{background:var(--acc);box-shadow:0 0 8px var(--acc)}

.panel{display:flex;flex-direction:column;gap:16px}
.sec{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0;padding-bottom:0}
.slot{display:grid;grid-template-columns:72px minmax(0,1fr);gap:6px 10px;align-items:center;padding:9px;border-radius:12px;background:var(--raise);border:1px solid var(--line)}
.slot.on{border-color:rgba(62,230,255,.45);background:linear-gradient(90deg,rgba(62,230,255,.07),transparent 70%)}
.slot .nm{font-weight:800;font-size:13.5px;display:flex;flex-direction:column}
.slot .nm small{font-family:var(--mono);font-weight:500;color:var(--dim);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.slot.on .nm small{color:var(--acc)}
.slot .wire{grid-column:2}
.slot .seg button[aria-pressed="true"].S{color:var(--tS);border-color:var(--tS);background:rgba(62,230,255,.10)}
.slot .seg button[aria-pressed="true"].H{color:var(--tH);border-color:var(--tH);background:rgba(165,147,255,.12);box-shadow:0 0 16px -4px rgba(165,147,255,.4)}
.slot .seg button[aria-pressed="true"].P{color:var(--tP);border-color:var(--tP);background:rgba(255,181,71,.10);box-shadow:0 0 16px -4px rgba(255,181,71,.35)}

.knobrow{display:grid;grid-template-columns:86px minmax(0,1fr) 38px;gap:10px;align-items:center}
.knobrow label{font-weight:700;font-size:13.5px}
.knobrow output{font-family:var(--mono);font-weight:700;text-align:right;color:var(--acc)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:var(--bg2);border:2px solid var(--acc);box-shadow:0 0 12px var(--acc-glow)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--bg2);border:2px solid var(--acc);box-shadow:0 0 12px var(--acc-glow)}

/* sound */
.sound{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(220px,1fr);gap:18px;align-items:start}
@media (max-width:640px){.sound{grid-template-columns:minmax(0,1fr)}}
.chartbox{min-width:0;display:flex;flex-direction:column;gap:8px}
.chartbox svg{width:100%;height:auto;display:block;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;font-family:var(--mono)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:18px;height:2px;border-radius:2px;display:inline-block}
.stats{display:flex;flex-direction:column;gap:10px}
.stat{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:7px}
.stat span{color:var(--muted);font-size:13px}
.stat b{font-family:var(--mono);font-size:15px;color:#fff}
.meter{height:6px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
.meter div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--acc-glow);transition:width .3s}
.char{font-family:var(--display);font-size:20px;letter-spacing:.06em;line-height:1.35;color:var(--acc);text-shadow:0 0 18px var(--acc-glow)}
.diff{font-size:12.5px;color:var(--muted);background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:0}
.play{display:flex;gap:8px;flex-wrap:wrap}
.play button.big{font-family:var(--body);font-weight:800;font-size:14px;letter-spacing:.02em;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;color:var(--acc-ink);background:linear-gradient(135deg,#7ff1ff,var(--acc));box-shadow:0 8px 24px -10px var(--acc-glow)}
.play button.big.alt{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.play button.big.alt:hover{box-shadow:inset 0 0 0 1px var(--acc);color:var(--acc)}
.play button.big:hover{filter:brightness(1.08)}
.note{font-size:11.5px;color:var(--dim);margin:0}
.secthead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.secthead h3{flex:1}
.tag{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid currentColor}
.tag.calc{color:var(--acc)}.tag.sim{color:var(--tP)}
.simbox{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(220px,1fr);gap:12px 18px;align-items:center;margin-top:16px;padding:12px;border-radius:12px;border:1px dashed rgba(255,181,71,.45);background:rgba(255,181,71,.04)}
.simtxt{display:flex;flex-direction:column;gap:8px;min-width:0}.simctl{display:flex;flex-direction:column;gap:10px}
@media (max-width:640px){.simbox{grid-template-columns:minmax(0,1fr)}}
.presets{display:flex;flex-direction:column;gap:6px}
.pdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.compat{border:1px solid var(--lc);border-left-width:4px;border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--muted);background:var(--raise)}
.compat b{color:var(--lc);font-weight:800}
.compat ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.seg button:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.tens{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.tens div{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border-radius:8px;background:var(--raise);border:1px solid var(--line)}
.tens span{font-family:var(--mono);font-size:10px;color:var(--dim)}.tens b{font-family:var(--mono);font-size:13px;color:var(--fg)}.tens small{font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.garage{display:flex;flex-direction:column;gap:10px}
.gmode{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.06em}
.gform{display:flex;flex-direction:column;gap:6px}
.grow{display:flex;gap:8px;flex-wrap:wrap}
.grow input{flex:1 1 200px;min-width:0;font:inherit;color:var(--fg);background:rgba(0,0,0,.25);border:1px solid var(--line2);border-radius:9px;padding:9px 11px}
.grow input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.gsave{font-family:var(--body);font-weight:800;font-size:13.5px;color:var(--acc-ink);background:linear-gradient(135deg,#7ff1ff,var(--acc));border:0;border-radius:9px;padding:9px 16px;cursor:pointer}
.gcmp{font-family:var(--body);font-weight:700;font-size:13px;color:var(--fg);background:var(--raise);border:1px solid var(--line2);border-radius:9px;padding:9px 14px;cursor:pointer}
.gcmp:hover{border-color:var(--acc);color:var(--acc)}
.gmsg{margin:0;font-size:12.5px;color:var(--muted);min-height:1em}.gmsg b{color:var(--fg)}.gnote{color:var(--dim)}
.glist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.glist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--raise);border:1px solid var(--line)}
.gname{display:flex;flex-direction:column;min-width:0}.gname b{overflow-wrap:anywhere}.gname small{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.gbtns{display:flex;gap:6px;flex:none}
.gbtns button{font-family:var(--body);font-weight:700;font-size:12.5px;color:var(--fg);background:transparent;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;cursor:pointer}
.gbtns button:hover{border-color:var(--acc);color:var(--acc)}
.wnotes[hidden]{display:none}
/* zväčšovanie okien a mobilná verzia */
.lcol{display:flex;flex-direction:column;gap:18px;min-width:0}
.pane{position:relative}
.pexp{position:absolute;top:10px;right:10px;z-index:5;width:32px;height:32px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line2);background:rgba(20,24,30,.6);color:var(--muted);cursor:pointer;backdrop-filter:blur(6px)}
.pexp:hover{color:var(--acc);border-color:var(--acc)}
@media (pointer:fine){ .wrap:not(.mobile) .pane:hover{border-color:rgba(62,230,255,.35)} }
.stage-head,.garage .secthead{padding-right:40px}
.setpane{padding:18px}
.focusbar{display:none}
.ovl{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;gap:12px;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:rgba(22,26,32,.94);backdrop-filter:blur(10px);animation:ovIn .18s ease-out}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.ovl{animation:none}}
.ovl[hidden]{display:none}
.ovbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1400px;width:100%;margin:0 auto}
.ovbar h2{margin:0;flex:1;min-width:0;font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.1em;text-transform:uppercase}
.ovback{font-family:var(--body);font-weight:800;font-size:14px;color:var(--acc-ink);background:linear-gradient(135deg,#7ff1ff,var(--acc));border:0;border-radius:10px;padding:10px 16px;cursor:pointer;box-shadow:0 8px 24px -10px var(--acc-glow)}
.ovslot{flex:1;min-height:0;max-width:1400px;width:100%;margin:0 auto;overflow:auto;border-radius:22px}
.ovslot>.pane{min-height:100%;background:var(--panel-solid);backdrop-filter:none}
.ovslot>.showroom{background:linear-gradient(160deg,#2b313b,#1f242c)}
.ovslot>.pane .pexp{display:none}
.ovdock{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:1400px;width:100%;margin:0 auto}
.ovdock button{display:flex;align-items:center;gap:8px;font-family:var(--body);font-weight:700;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:9px 14px;cursor:pointer}
.ovdock button:hover{border-color:var(--acc);color:var(--acc)}
.ovdock button[aria-current="true"]{color:var(--acc);border-color:var(--acc);background:var(--acc-soft)}
.ovdock .k{font-family:var(--mono);font-size:10px;color:var(--dim)}
body.ovopen{overflow:hidden}
.ovslot .setpane .panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px 28px;align-items:start}
.ovslot .setpane .sec{border-bottom:0}
.ovslot #guitar{max-height:calc(100vh - 330px)}
.ovslot .sr-stage{height:calc(100vh - 230px);min-height:360px}
.ovslot .chartbox svg#chart{max-height:calc(100vh - 420px)}
.ph{display:none}
#guitar.vert{max-height:72vh;width:100%}
.tabbar{display:none}
@media (max-width:760px) and (pointer:coarse){
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .wrap.mobile .pane:not(.focused){display:none}
  .wrap.mobile .focusbar,.wrap.mobile .pexp{display:none}
  .wrap.mobile.focusing{display:flex}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;gap:2px;
    padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));
    background:rgba(28,32,40,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line2)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-family:var(--body);font-weight:700;font-size:10.5px;cursor:pointer;min-height:52px}
  .tabbar button[aria-current="true"]{color:var(--acc);background:var(--acc-soft)}
  .seg button,.selector button{min-height:40px}
  .knobrow{grid-template-columns:72px minmax(0,1fr) 34px}
  input[type=range]{height:34px}
  h1{font-size:20px}
  header.top p{display:none}
  header.top{gap:10px}
  .pick{width:30px;height:30px}
  #guitar.vert{max-height:62vh}
  .tens{grid-template-columns:repeat(3,minmax(0,1fr))}
}

.gempty{color:var(--dim);font-size:12.5px;justify-content:flex-start!important}
#chart{touch-action:none}
.eqh{cursor:grab;outline:none}.eqh:active{cursor:grabbing}
.eqh:focus-visible circle:nth-child(2){stroke-width:4}
.eqrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.eqhint{font-size:12px;color:var(--muted)}
.eqreset{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--raise);border:1px solid var(--line2);border-radius:8px;padding:5px 10px;cursor:pointer}
.eqreset:hover{color:var(--acc);border-color:var(--acc)}

/* 3D showroom */
.showroom{position:relative;display:grid;grid-template-columns:minmax(230px,300px) minmax(0,1fr);border-radius:22px;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01));border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 40px 80px -40px rgba(0,0,0,.9)}
.showroom::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.6}

function smoothPath(P){
  const n=P.length; let d=`M${P[0][0]} ${P[0][1]}`;
  for(let i=0;i<n;i++){ const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0]} ${p2[1]}`; }
  return d+" Z";
}

  {k:"eqM",type:"peaking",f:700,g:0,q:.9,fmin:250,fmax:1500,col:"#45f0b4"},
  {k:"eqP",type:"peaking",f:2500,g:0,q:1.1,fmin:1200,fmax:5000,col:"#ffb547"},
  {k:"eqT",type:"highshelf",f:6000,g:0,fmin:3500,fmax:10000,col:"#3ee6ff"}
];
function biqDb(b,f){
  if(!b.g) return 0;
  const fs=48000, A=Math.pow(10,b.g/40), w0=2*Math.PI*b.f/fs, cs=Math.cos(w0), sn=Math.sin(w0);
  let b0,b1,b2,a0,a1,a2;
  if(b.type==="peaking"){ const al=sn/(2*(b.q||1)); b0=1+al*A; b1=-2*cs; b2=1-al*A; a0=1+al/A; a1=-2*cs; a2=1-al/A; }
  else { const al=sn/Math.SQRT2, r=2*Math.sqrt(A)*al;
    if(b.type==="lowshelf"){ b0=A*((A+1)-(A-1)*cs+r); b1=2*A*((A-1)-(A+1)*cs); b2=A*((A+1)-(A-1)*cs-r); a0=(A+1)+(A-1)*cs+r; a1=-2*((A-1)+(A+1)*cs); a2=(A+1)+(A-1)*cs-r; }
    else { b0=A*((A+1)+(A-1)*cs+r); b1=-2*A*((A-1)+(A+1)*cs); b2=A*((A+1)+(A-1)*cs-r); a0=(A+1)-(A-1)*cs+r; a1=2*((A-1)-(A+1)*cs); a2=(A+1)-(A-1)*cs-r; } }
  const w=2*Math.PI*f/fs, c1=Math.cos(w), s1=Math.sin(w), c2=Math.cos(2*w), s2=Math.sin(2*w);
  const nr=b0+b1*c1+b2*c2, ni=-(b1*s1+b2*s2), dr=a0+a1*c1+a2*c2, di=-(a1*s1+a2*s2);
  return 10*Math.log10((nr*nr+ni*ni)/(dr*dr+di*di));
}
const eqDb=f=>EQ.reduce((a,b)=>a+biqDb(b,f),0);
function analyse(){
  const c=circuit(), pts=[];
  for(let i=0;i<=220;i++){ const f=F0*Math.pow(F1/F0,i/220); const m=mag(c,f); pts.push([f,(m>0?20*Math.log10(m):-60)+eqDb(f)]); }
  const base=pts.find(p=>p[0]>=500)[1];
  let pk=pts.find(p=>p[0]>800); for(const p of pts) if(p[0]>800 && p[1]>pk[1]) pk=p;
  let peakDb = pk[1]-base;
  let fc = pts.find(p=>p[0]>500 && p[1]<base-3); fc = fc?fc[0]:F1;
  const peakF = peakDb>1 ? pk[0] : fc;
  const at=f=>pts.reduce((b,p)=>Math.abs(Math.log(p[0]/f))<Math.abs(Math.log(b[0]/f))?p:b)[1];
  return {c,pts,base,peakF,peakDb:Math.max(0,peakDb),outDb:base,lo:at(130),hi:at(6000)};
}

function wiringNotes(){
  const n=count(), act=activeIdx(), out=[];

/* ---------- kompatibilita konfigurácie s modelom ---------- */
const POTS_FOR={1:["1V1T"],2:["1V1T","2V2T"],3:["1V1T","1V2T"]};
const POT_COUNT={"1V1T":2,"1V2T":3,"2V2T":4};
function defaultPots(n){ const m=M(); if(POTS_FOR[n].includes(m.pots)) return m.pots; return n===3?"1V2T":n===2?(m.id==="strat"||m.id==="tele"?"1V1T":"2V2T"):"1V1T"; }
// kód sa píše od kobylky ku krku (HSS = humbucker pri kobylke)
function cfgCode(slots){ return slots.map(s=>s.t||s).slice().reverse().join(""); }
// úroveň: 0 originál, 1 bez úprav, 2 bežná úprava, 3 väčšia úprava tela, 4 neodporúča sa
function compat(slots,pots){
  const m=M(), n=slots.length, P=PHOTOS[m.photo], C=CTRL[m.photo], msgs=[]; let lvl=1;
  const orig=cfgCode(m.slots.map(s=>s[0]));
  const up=(l,key,extra)=>{ lvl=Math.max(lvl,l); msgs.push({l,txt:t(key).replace("{x}",extra||"")}); };
  const isOrig = cfgCode(slots)===orig && n===m.slots.length;
  if(m.id==="strat"){
    if(slots.some((s,i)=>s.t==="H" && P.orig[POS[n].k[i]]!=="H")) up(2,"cHinS");
    if(slots.some(s=>s.t==="P")) up(2,"cPinS");
    if(n<3) up(2,"cGuard",String(m.slots.length));
  } else if(m.id==="tele"){
    if(n===3) up(2,"cTele3");
    if(n===1) up(2,"cGuard",String(m.slots.length));
    slots.forEach((s,i)=>{ const pos=POS[n].k[i];
      if(s.t==="H" && pos==="neck") up(2,"cTeleHN");
      if(s.t==="H" && pos==="bridge") up(2,"cTeleHB");
      if(s.t==="P") up(2,"cPinS"); });
  } else {
    const hollow=m.body==="hollow", semi=m.body==="semi";
    if(n===3) up(hollow?4:semi?4:3, hollow?"c3Hollow":semi?"c3Semi":"c3Solid");
    slots.forEach((s,i)=>{ const pos=POS[n].k[i];
      if(s.t==="S" && pos!=="middle") up(2,"cSinH");
      if(s.t==="P" && pos!=="middle") { if(m.id==="es175") msgs.push({l:1,txt:t("c175P")}); else up(2,"cPinH"); } });
    if(n===1) { if(m.id==="es175") msgs.push({l:1,txt:t("c175one")}); else up(2,"cOne"); }
  }
  const need=POT_COUNT[pots], have=C?C.knobs.length:need;
  if(need>have) up(2,"cMoreKnobs",String(need-have));
  if(need<have) msgs.push({l:1,txt:t("cFewerKnobs").replace("{x}",String(have-need))});
  if(!POTS_FOR[n].includes(pots)) up(4,"cPotsBad");
  if(isOrig && lvl<=1 && pots===m.pots) lvl=0;
  return {lvl,msgs};
}
const LVL=[{k:"lv0",c:"#45f0b4"},{k:"lv1",c:"#45f0b4"},{k:"lv2",c:"#ffb547"},{k:"lv3",c:"#ff8a4a"},{k:"lv4",c:"#ff5d6c"}];
const PRESETS=[["SSS",["S","S","S"]],["HSS",["H","S","S"]],["HSH",["H","S","H"]],["SS",["S","S"]],["HS",["H","S"]],["SH",["S","H"]],["HH",["H","H"]],["PP",["P","P"]],["H",["H"]]];
function applyPreset(code){
  const p=PRESETS.find(x=>x[0]===code); if(!p) return;
  S.slots=p[1].slice().reverse().map(t0=>({t:t0,w:"ser"})); S.sel=0; S.pots=defaultPots(S.slots.length);
}

/* ---------- ťah strún: menzúra, ladenie, sada ---------- */
const TUNINGS={E:{n:"E štandard",ne:"E standard",o:[0,0,0,0,0,0]},Eb:{n:"Eb (o pol tónu nižšie)",ne:"Eb (half step down)",o:[-1,-1,-1,-1,-1,-1]},DropD:{n:"Drop D",ne:"Drop D",o:[-2,0,0,0,0,0]},D:{n:"D štandard",ne:"D standard",o:[-2,-2,-2,-2,-2,-2]}};
const OPEN0=[40,45,50,55,59,64];
const openNotes=()=>OPEN0.map((n,i)=>n+(TUNINGS[S.tuning||"E"].o[i]));
function unitWeight(d,wound){ return wound ? (d<0.03?0.178:0.185)*d*d : 0.2227*d*d; } // lb/in
function tensions(){
  const g=GAUGES[S.gauge], L=M().scale||25.5, notes=openNotes(), nw=S.gauge===12?4:3;
  // g.g je od hrubej (E6) po tenkú (E1); notes sú od E6 po E1
  return g.g.map((d,i)=>{ const f=mtof(notes[i]); const lb=unitWeight(d,i<nw)*Math.pow(2*L*f,2)/386.4; return {d,kg:lb*0.4536,note:notes[i]}; });
}
const NOTE_N=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const noteName=m=>NOTE_N[m%12]+(Math.floor(m/12)-1);

function knobMap(){
  // ktoré gombíky na fotke patria volume / tónu pre aktuálne zapojenie
  const C=CTRL[M().photo]; if(!C) return [];
  const n=count(), out=[];
  if(S.pots==="2V2T"){ for(let i=0;i<2;i++){ out.push({k:C.knobs[i],kind:"vol"}); } for(let i=0;i<2;i++){ if(C.knobs[2+i]) out.push({k:C.knobs[2+i],kind:"tone"}); } }
  else { out.push({k:C.knobs[0],kind:"vol"}); const nt=S.pots==="1V2T"?2:1; for(let i=0;i<nt;i++){ if(C.knobs[1+i]) out.push({k:C.knobs[1+i],kind:"tone"}); } }
  return out.filter(o=>o.k);
}
function arcPath(r,v){ const a0=-150*Math.PI/180, a1=(-150+300*v/10)*Math.PI/180; const p=a=>[Math.sin(a)*r,-Math.cos(a)*r]; const [x0,y0]=p(a0),[x1,y1]=p(a1); const large=(a1-a0)>Math.PI?1:0; return v<=0?"":`M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; }
function knobOverlay(){
  const P=PHOTOS[M().photo], r=15*P.spread/61.5;
  return knobMap().map(o=>{ const v=o.kind==="vol"?S.vol:S.tone, col=o.kind==="vol"?"#3ee6ff":"#a593ff";
    return `<g class="kring" data-kind="${o.kind}" transform="translate(${o.k[0]} ${o.k[1]})"><circle r="${r}" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="${r*.32}"/><path class="karc" d="${arcPath(r,v)}" fill="none" stroke="${col}" stroke-width="${r*.22}" stroke-linecap="round"/><circle r="${r*.2}" fill="${col}"/></g>`; }).join("");
}
function updateKnobs(){
  const P=PHOTOS[M().photo], r=15*P.spread/61.5;

function snapshotCfg(){ return {model:M().id,slots:S.slots.map(s=>({t:s.t,w:s.w})),sel:S.sel,pots:S.pots,pv:S.pv,cap:S.cap,vol:S.vol,tone:S.tone,gauge:S.gauge,tuning:S.tuning||"E",eq:EQ.map(b=>({f:b.f,g:b.g}))}; }
function applyCfg(c){
  const i=MODELS.findIndex(m=>m.id===c.model); if(i<0) return;
  const old=S.mi; loadModel(i);
  Object.assign(S,{slots:c.slots.map(s=>({t:s.t,w:s.w||"ser"})),sel:c.sel||0,pots:c.pots,pv:c.pv,cap:c.cap,vol:c.vol,tone:c.tone,gauge:c.gauge,tuning:c.tuning||"E"});
  (c.eq||[]).forEach((b,k)=>{ if(EQ[k]){ EQ[k].f=b.f; EQ[k].g=b.g; } });
  if(old!==i && angles){ let d=((i-old)%NM+NM)%NM; if(d>NM/2) d-=NM; angles=angles.map(a=>a-d*STEP); }
}
function lsRead(){ try{ return JSON.parse(localStorage.getItem(LSK)||"[]"); }catch(e){ return []; } }
function lsWrite(a){ try{ localStorage.setItem(LSK,JSON.stringify(a)); return true; }catch(e){ return false; } }
async function initStore(){
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(db && user){ uid=await user.id(); if(uid){ STORE=db.collection("data/users/"+uid+"/garage");
      unsub=STORE.onSnapshot(snap=>{ SAVED=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.savedAt||0)-(a.savedAt||0)); renderGarage(); }, ()=>{ STORE=null; SAVED=lsRead(); renderGarage(); }); return; } }
  }catch(e){}
  SAVED=lsRead(); renderGarage();
}
async function saveCfg(name){
  const doc={name:name.slice(0,60),savedAt:Date.now(),cfg:snapshotCfg()};
  const msg=document.getElementById("gMsg");
  try{
    if(STORE){ await STORE.add(doc); }
    else { const a=(MEMONLY?SAVED.slice():lsRead()); a.unshift({id:"l"+Date.now(),...doc}); if(!MEMONLY && !lsWrite(a)) MEMONLY=true; SAVED=a; renderGarage(); }
    msg.textContent=t("gSaved").replace("{n}",doc.name)+(MEMONLY&&!STORE?" "+t("gMem"):"");
  }catch(e){ msg.textContent=t("gErr"); }
}
async function delCfg(id){
  try{ if(STORE) await STORE.doc(id).delete(); else { const a=(MEMONLY?SAVED:lsRead()).filter(x=>x.id!==id); if(!MEMONLY) lsWrite(a); SAVED=a; renderGarage(); } }catch(e){ document.getElementById("gMsg").textContent=t("gErr"); }
}
function renderGarage(){
  const el=document.getElementById("gList"); if(!el) return;
  const mode=document.getElementById("gMode"); if(mode) mode.textContent=STORE?t("gCloud"):t("gLocal");
  if(!SAVED.length){ el.innerHTML=`<li class="gempty">${t("gEmpty")}</li>`; return; }
  el.innerHTML=SAVED.map(x=>{ const m=MODELS.find(mm=>mm.id===x.cfg?.model); const c=x.cfg||{};
    return `<li><div class="gname"><b>${esc(x.name||"—")}</b><small>${m?esc(m.n):"?"} · ${esc(cfgCode(c.slots||[]))} · ${esc(c.pots||"")}</small></div>
      <div class="gbtns"><button data-gl="${esc(x.id)}">${t("gLoad")}</button><button data-gd="${esc(x.id)}" class="gdel" aria-label="${t("gDel")}">✕</button></div></li>`; }).join("");
}
function compareOriginal(){
  const cur=snapshotCfg(), m=M();
  const snap=JSON.stringify(S), eqs=EQ.map(b=>({...b}));
  loadModel(S.mi); EQ.forEach(b=>b.g=0);
  const orig=analyse();
  Object.assign(S,JSON.parse(snap)); EQ.forEach((b,k)=>Object.assign(b,eqs[k]));
  prevM=orig; renderSound();
  const diffs=[];
  const oc=cfgCode(m.slots.map(s=>s[0])); if(cfgCode(cur.slots)!==oc) diffs.push(`${t("pickups")}: ${oc} → ${cfgCode(cur.slots)}`);
  cur.slots.forEach((s,i)=>{ if(s.t==="H"&&s.w!=="ser") diffs.push(`${posName(cur.slots.length,i)}: ${t(s.w)}`); });
  if(cur.pots!==m.pots) diffs.push(`${t("wiring")}: ${m.pots} → ${cur.pots}`);
  if(cur.pv!==m.pv) diffs.push(`${t("value")}: ${m.pv} → ${cur.pv} kΩ`);
  if(cur.cap!==m.cap) diffs.push(`${t("capL")}: ${num(m.cap,null)} → ${num(cur.cap,null)} µF`);
  if(cur.gauge!==10) diffs.push(`${t("strings")}: 10–46 → ${GAUGES[cur.gauge].n}`);
  if((cur.tuning||"E")!=="E") diffs.push(`${t("tuningL")}: ${tName("E")} → ${tName(cur.tuning)}`);
  if(EQ.some(b=>b.g)) diffs.push(t("eqUsed"));
  document.getElementById("gMsg").innerHTML=`<b>${t("gCmpT")}</b> `+(diffs.length?esc(diffs.join(" · ")):t("gSame"))+` <span class="gnote">${t("gCmpNote")}</span>`;
}

/* ---------- 3D showroom ---------- */
const NM=MODELS.length, STEP=360/NM;
let angles=null, R3=260, items=[];
function thumbURL(i){
  const P=PHOTOS[MODELS[i].photo];
  if(i!==S.mi) return P.src;
  UI=false; const inner=photoInner(); UI=true;
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${P.w} ${P.h}">${inner}</svg>`);
}
function layoutRing(){
  const st=document.getElementById("srStage"), W=st.clientWidth, H=st.clientHeight;
  R3=Math.max(140,Math.min(W*.34,360));
  const mag=1300/(1300-R3); st.style.setProperty("--ih",Math.round(H*.80/mag)+"px");
  items.forEach((el,i)=>{
    const a=angles[i], r=a*Math.PI/180, c=Math.cos(r), k=(c+1)/2;
    el.style.transform=`translate(-50%,-50%) rotateY(${a}deg) translateZ(${R3}px) rotateY(${-a+16*Math.sin(r)}deg)`;
    el.style.opacity=(.18+.82*Math.pow(k,1.6)).toFixed(3);
    el.style.filter=`brightness(${(.4+.6*k).toFixed(3)}) saturate(${(.5+.5*k).toFixed(3)})`;
    el.tabIndex = i===S.mi?-1:0;
    el.setAttribute("aria-current",String(i===S.mi));
  });
}
function renderCarousel(){
  const ring=document.getElementById("ring");
  if(!angles){
    angles=MODELS.map((_,i)=>{ let a=((i-S.mi)*STEP)%360; if(a>180)a-=360; if(a<-180)a+=360; return a; });
    ring.innerHTML=MODELS.map((m,i)=>`<button class="c3d" data-i="${i}" aria-label="${m.n}"><img alt="" src="${thumbURL(i)}"></button>`).join("");
    items=[...ring.querySelectorAll(".c3d")];
    items.forEach(el=>el.addEventListener("click",()=>{ if(dragMoved) return; const i=+el.dataset.i; if(i!==S.mi) pickModel(i); }));
  } else {
    items[S.mi].querySelector("img").src=thumbURL(S.mi);
  }
  const m=M();
  document.getElementById("srCount").innerHTML=`<b>${String(S.mi+1).padStart(2,"0")}</b> / ${String(NM).padStart(2,"0")}`;
  document.getElementById("srName").textContent=m.n;
  document.getElementById("srNote").textContent=note(m);
  document.getElementById("srChips").innerHTML=S.slots.map(s=>`<span class="chip ${s.t}">${s.t==="S"?"Single":s.t==="H"?"Humbucker":"P-90"}</span>`).join("");
  layoutRing();
}
function pickModel(i,d){
  i=(i+NM)%NM; if(i===S.mi) return;
  if(d===undefined){ d=((i-S.mi)%NM+NM)%NM; if(d>NM/2) d-=NM; }
  angles=angles.map(a=>a-d*STEP);
  const old=S.mi;
  prevM=analyse(); loadModel(i); renderAll();
  items[old].querySelector("img").src=thumbURL(old);
}
let dragX=null, dragMoved=false;
(()=>{
  const st=document.getElementById("srStage");
  st.addEventListener("pointerdown",e=>{dragX=e.clientX; dragMoved=false;});
  st.addEventListener("pointermove",e=>{ if(dragX!==null && Math.abs(e.clientX-dragX)>8) dragMoved=true; });
  const end=e=>{ if(dragX===null) return; const dx=e.clientX-dragX; dragX=null;
    if(Math.abs(dx)>40){ const steps=Math.max(1,Math.min(3,Math.round(Math.abs(dx)/140))); const d=dx<0?steps:-steps; pickModel(S.mi+d,d); }
    setTimeout(()=>{dragMoved=false;},0); };
  st.addEventListener("pointerup",end); st.addEventListener("pointercancel",()=>{dragX=null;});
  st.addEventListener("keydown",e=>{ if(e.key==="ArrowRight"){e.preventDefault();pickModel(S.mi+1,1);} else if(e.key==="ArrowLeft"){e.preventDefault();pickModel(S.mi-1,-1);} });
  window.addEventListener("resize",()=>{ if(angles) layoutRing(); });
})();

    <p class="why">${t("potWhy")}${S.pots==="1V2T"&&n===3?" "+t("potWhy2"):""}</p></div>`;
  h+=`<div class="sec"><h3><i style="background:var(--sig);color:var(--sig)"></i>${t("strings")}</h3>

document.getElementById("panel").addEventListener("click",e=>{
  const b=e.target.closest("button[data-k]"); if(!b||b.disabled) return;
  const k=b.dataset.k, v=b.dataset.v;

      S.slots = nn===1?[{...bridge}]:nn===2?[{...neck},{...bridge}]:[{...neck},{...mid},{...bridge}];
      if(old.length===1 && nn>1) S.slots[0]={t:bridge.t,w:bridge.w};
      S.sel=0; if(!POTS_FOR[nn].includes(S.pots)) S.pots=defaultPots(nn); }
    else if(k==="preset") applyPreset(v);
    else if(k.startsWith("type:")) S.slots[+k.split(":")[1]].t=v;
    else if(k.startsWith("wire:")) S.slots[+k.split(":")[1]].w=v;
    else if(k==="pots"){ if(POTS_FOR[count()].includes(v)) S.pots=v; }

    else S[k]=v;
  });
});

/* ---------- graf a zvuk ---------- */
const num=(v,d)=>{const x=d==null?String(v):v.toFixed(d); return LANG==="sk"?x.replace(".",","):x;};
const fmtF=f=>f>=1000?num(f/1000,1)+" kHz":Math.round(f)+" Hz";
function character(a){
  const f=a.peakF;
  let c = t(f>5200?"c1":f>3800?"c2":f>2800?"c3":f>2000?"c4":"c5");
  if(a.outDb>3) c+=t("loud"); else if(a.outDb<-6) c+=t("quiet");
  return c[0].toUpperCase()+c.slice(1);
}
function curvePath(pts,X,Y){ return pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(Math.max(-32,Math.min(24,p[1]))).toFixed(1)).join(" "); }
function renderSound(){
  liveUpdate();
  const a=analyse();
  const W=640,H=170,ml=34,mr=10,mt=10,mb=22;
  const X=f=>ml+(Math.log10(f)-Math.log10(F0))/(Math.log10(F1)-Math.log10(F0))*(W-ml-mr);
  const Y=db=>mt+(24-db)/56*(H-mt-mb);
  let s=`<defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3ee6ff" stop-opacity=".55"/><stop offset="1" stop-color="#8f7dff" stop-opacity="0"/></linearGradient></defs>`;
  [20,10,0,-10,-20,-30].forEach(db=>{ s+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(db)}" y2="${Y(db)}" stroke="#1c2533" stroke-width="1"/><text x="${ml-6}" y="${Y(db)+4}" text-anchor="end" font-size="11" fill="#5f6b7d" font-family="JetBrains Mono,monospace">${db>0?"+":""}${db}</text>`; });
  [[100,"100"],[200,"200"],[500,"500"],[1000,"1k"],[2000,"2k"],[5000,"5k"],[10000,"10k"]].forEach(([f,l])=>{ s+=`<line x1="${X(f)}" x2="${X(f)}" y1="${mt}" y2="${H-mb}" stroke="#1c2533" stroke-dasharray="2 4"/><text x="${X(f)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#5f6b7d" font-family="JetBrains Mono,monospace">${l}</text>`; });
  s+=`<text x="${W-mr}" y="${H-8}" text-anchor="end" font-size="11" fill="#5f6b7d" font-family="Manrope,sans-serif" dx="0" dy="-12">Hz</text>`;
  s+=`<text x="${ml+4}" y="${mt+10}" font-size="11" fill="#5f6b7d" font-family="Manrope,sans-serif">dB</text>`;
  if(prevM) s+=`<path d="${curvePath(prevM.pts,X,Y)}" fill="none" stroke="#97a3b4" stroke-opacity=".75" stroke-width="2" stroke-dasharray="6 5"/>`;
  const cp=curvePath(a.pts,X,Y);
  s+=`<path d="${cp} L${X(F1)} ${Y(-32)} L${X(F0)} ${Y(-32)} Z" fill="url(#area)"/>`;
  s+=`<path d="${cp}" fill="none" stroke="#3ee6ff" stroke-width="3" stroke-linejoin="round"/>`;
  if(S.vol>0){ const pv=a.pts.reduce((b,p)=>Math.abs(p[0]-a.peakF)<Math.abs(b[0]-a.peakF)?p:b); const px=X(pv[0]),py=Y(Math.max(-32,Math.min(24,pv[1])));
    s+=`<circle cx="${px}" cy="${py}" r="4" fill="#05070a" stroke="#e8eef6" stroke-width="2"/>`; }
  EQ.forEach((b,i)=>{ const x=X(b.f), y=Y(Math.max(-32,Math.min(24,20*Math.log10(Math.max(1e-6,mag(a.c,b.f)))+eqDb(b.f))));
    s+=`<g class="eqh" data-i="${i}" tabindex="0" role="slider" aria-label="${t(b.k)}" aria-valuemin="-12" aria-valuemax="12" aria-valuenow="${b.g.toFixed(1)}"><circle cx="${x}" cy="${y}" r="16" fill="transparent"/><circle cx="${x}" cy="${y}" r="7" fill="#05070a" stroke="${b.col}" stroke-width="2.5"/><circle cx="${x}" cy="${y}" r="2.5" fill="${b.col}"/><text x="${x}" y="${y-13}" text-anchor="middle" font-size="10" font-weight="700" fill="${b.col}" font-family="JetBrains Mono,monospace">${t(b.k)}${b.g?(b.g>0?" +":" ")+b.g.toFixed(0):""}</text></g>`; });
  document.getElementById("chart").innerHTML=s;
  document.getElementById("chart").__geo={X,Y,W,H,ml,mr,mt,mb};
  document.getElementById("char").textContent = S.vol>0?character(a):t("silent");
  document.getElementById("sPeak").textContent=fmtF(a.peakF);
  document.getElementById("sQ").textContent="+"+num(a.peakDb,1)+" dB";
  const o=S.vol>0?a.outDb:-60;
  document.getElementById("sOut").textContent=(o>0?"+":"")+(o<-59?"—":num(o,1))+" dB";
  document.getElementById("mOut").style.width=Math.max(0,Math.min(100,(o+14)/22*100))+"%";
  let d=t("diff0");
  if(prevM){
    const df=a.peakF-prevM.peakF, dout=a.outDb-prevM.outDb, parts=[];
    if(Math.abs(df)>80) parts.push(`${t("peakW")} ${fmtF(prevM.peakF)} → ${fmtF(a.peakF)} (${df>0?t("brighter"):t("darker")})`);
    if(Math.abs(dout)>.4) parts.push(`${t("outW")} ${dout>0?"+":""}${num(dout,1)} dB (${dout>0?t("stronger"):t("weaker")})`);
    if(prevM.lo!==undefined&&Math.abs(a.lo-prevM.lo)>.8) parts.push(`${t("lowW")} ${a.lo>prevM.lo?"+":""}${num(a.lo-prevM.lo,1)} dB`);
    if(prevM.hi!==undefined&&Math.abs(a.hi-prevM.hi)>.8) parts.push(`${t("highW")} ${a.hi>prevM.hi?"+":""}${num(a.hi-prevM.hi,1)} dB`);
    if(Math.abs(a.peakDb-prevM.peakDb)>.8) parts.push(a.peakDb>prevM.peakDb?t("resUp"):t("resDown"));
    d = parts.length?t("vsPrev")+parts.join(", ")+".":t("vsSame");
  }
  document.getElementById("diff").textContent=d;
}

  }
  // vlastná 8-taktová skladba: Am – F – C – G (arpeggio), Am – Dm (melódia navrchu), E7 (prechod basom), Am (úder)
  const E=.30, X=null;
  const SH={Am:[X,0,2,2,1,0],F:[X,X,3,2,1,0],C:[X,3,2,0,1,0],G:[3,2,0,0,0,3],Dm:[X,X,0,2,3,1],E7:[0,2,0,1,0,0]};
  const RT={Am:1,F:2,C:1,G:0,Dm:2,E7:0};
  const bars=[
    ["Am",["r",3,4,5,4,3,2,3]],
    ["F", ["r",3,4,5,4,3,2,3]],
    ["C", ["r",3,4,5,4,3,2,3]],
    ["G", ["r",5,4,3,2,3,4,5]],
    ["Am",[[1,0],[4,1],[5,0],[5,3],[3,2],[5,5],[5,3],[4,1]]],
    ["Dm",[[2,0],[4,3],[5,1],[4,3],[3,2],[5,3],[5,1],[4,3]]],
    ["E7",[[0,0],[2,0],[3,1],[4,0],[5,0],[4,0],[3,1],[2,2]]],
  ];
  let t=.05;
  bars.forEach(([ch,pat],b)=>{ const sw=b%2?.012:0;
    pat.forEach((p,k)=>{ let st,f; if(Array.isArray(p)){ [st,f]=p; } else { st=p==="r"?RT[ch]:p; f=SH[ch][st]; }
      if(f==null) return; const acc=k===0?.98:k===4?.86:.7;
      ev.push({s:st,f,t:t+k*E+(k%2?sw:0)+hum(),v:Math.min(1,acc+Math.random()*.1)}); });
    t+=8*E; });
  // záverečný úder Am a dozvuk
  SH.Am.forEach((f,st)=>{ if(f!=null) ev.push({s:st,f,t:t+(st-1)*.03,v:.9}); });
  return {ev,dur:t+3.6};
}
function pickupTaps(){
  const n=count(), taps=[];
  activeIdx().forEach(i=>{
    const pos=POS[n].k[i], mp=M().pos||{neck:.24,middle:.155,bridge:.07}, p=mp[pos], sl=S.slots[i], dc=.0145;
    if(sl.t==="H" && sl.w==="par"){ taps.push([p-dc,.5],[p+dc,.5]); } else if(sl.t==="H" && sl.w==="ser"){ taps.push([p-dc,.5],[p+dc,.5]); } else if(sl.t==="H"){ taps.push([p+dc,1]); } else taps.push([p,1]);
  });
  const tot=taps.reduce((a,x)=>a+x[1],0); return taps.map(x=>[x[0],x[1]/tot]);
}
function renderStrings(evs,dur){
  const sr=ctx.sampleRate, len=Math.floor(sr*dur), out=new Float32Array(len);
  const taps=pickupTaps(), gBoost=1+(S.gauge-10)*.08;
  for(let s=0;s<6;s++){
    const notes=evs.filter(e=>e.s===s).sort((a,b)=>a.t-b.t);
    notes.forEach((nt,k)=>{
      const f=mtof(openNotes()[s]+nt.f)*(1+(Math.random()-.5)*.0014);
      const Nf=sr/f-.5, N=Math.floor(Nf), frac=Nf-N, C=(1-frac)/(1+frac);
      const wound = s<(S.gauge===12?4:3);
      const T60=(s<3?5.2:3.6)*gBoost*(nt.f>5?.85:1)*({solid:1,semi:.85,hollow:.62}[M().body]||1);
      const g=Math.pow(10,-3/(T60*f)), B=wound?.5:.42;
      // budenie: šum, zmäkčený trsátkom, s hrebeňom podľa miesta brnknutia
      const buf=new Float32Array(N); let lp=0; const soft=.25+.35*(1-nt.v);
      const raw=new Float32Array(N); for(let i=0;i<N;i++){ lp=lp*soft+(Math.random()*2-1)*(1-soft); raw[i]=lp; }
      const P=Math.max(1,Math.round(N*.16)); let mean=0;
      for(let i=0;i<N;i++){ buf[i]=raw[i]-raw[(i-P+N)%N]; mean+=buf[i]; } mean/=N; for(let i=0;i<N;i++) buf[i]-=mean;
      const Ms=taps.map(tp=>Math.max(1,Math.round(N*tp[0]))), H=Math.max(...Ms)+1, hist=new Float32Array(H);
      const st=Math.floor(nt.t*sr), next=k+1<notes.length?Math.floor(notes[k+1].t*sr):len;
      const fadeN=Math.floor(.025*sr), stop=Math.min(len, next+fadeN, st+Math.floor(T60*1.15*sr));
      let p=0,x1=0,y1=0,h=0;
      for(let n=st;n<stop;n++){
        const cur=buf[p], nx=buf[p+1<N?p+1:0];
        const l=g*((1-B)*cur+B*nx);
        const ap=C*l+x1-C*y1; x1=l; y1=ap; buf[p]=ap; p=p+1<N?p+1:0;
        hist[h]=cur; let y=0;
        for(let j=0;j<Ms.length;j++){ y+=taps[j][1]*(cur-hist[(h-Ms[j]+H)%H]); }
        h=h+1<H?h+1:0;
        let a=nt.v; if(n>=next) a*=1-(n-next)/fadeN;
        out[n]+=y*a;
      }
      // klik trsátka
      for(let n=0;n<Math.floor(.004*sr)&&st+n<len;n++) out[st+n]+=(Math.random()*2-1)*.04*nt.v*(1-n/(.004*sr));
    });
  }
  let mx=0; for(let i=0;i<len;i++) mx=Math.max(mx,Math.abs(out[i])); const gn=mx>0?.85/mx:1; for(let i=0;i<len;i++) out[i]*=gn;
  const b=ctx.createBuffer(1,len,sr); b.copyToChannel(out,0); return b;
}
function makeIR(){
  const sr=ctx.sampleRate, len=Math.floor(sr*2.2), b=ctx.createBuffer(2,len,sr);
  for(let c=0;c<2;c++){ const d=b.getChannelData(c); let lp=0;
    for(let i=0;i<len;i++){ const t=i/sr, k=Math.min(.92,.2+t*.5); lp=lp*k+(Math.random()*2-1)*(1-k); d[i]=lp*Math.exp(-t*3.1)*(t<.012?t/.012:1); } }
  return b;
}
function biq(type,f,q,gain){ const b=ctx.createBiquadFilter(); b.type=type; b.frequency.value=f; if(q!=null) b.Q.value=q; if(gain!=null) b.gain.value=gain; return b; }
function shaper(drive,asym){ const ws=ctx.createWaveShaper(), c=new Float32Array(2048); for(let i=0;i<2048;i++){ const x=i/1023.5-1; c[i]=Math.tanh(drive*x+asym*x*x)/Math.tanh(drive); } ws.curve=c; ws.oversample="4x"; return ws; }
function chain(nodes){ for(let i=0;i<nodes.length-1;i++) nodes[i].connect(nodes[i+1]); return nodes[nodes.length-1]; }
// FIR filter s rovnakou frekvenčnou charakteristikou ako graf (obvod snímač–potenciometre–kábel + ekvalizér)
function circuitFIR(a){
  const sr=ctx.sampleRate, N=2048, H=N/2, c=a.c, ref=mag(c,500,true)||1;
  const M=new Float64Array(H+1);
  for(let k=0;k<=H;k++){ const f=Math.max(20,k*sr/N); M[k]=f>20000?0:mag(c,Math.min(f,20000),true)/ref; }
  const b=ctx.createBuffer(1,N,sr), h=b.getChannelData(0);
  for(let n=0;n<N;n++){ const t=n-H; let v=M[0];
    for(let k=1;k<H;k++) v+=2*M[k]*Math.cos(2*Math.PI*k*t/N);
    v+=M[H]*Math.cos(Math.PI*t); h[n]=v/N*(0.5-0.5*Math.cos(2*Math.PI*n/(N-1))); }
  return b;
}
// zmeny počas prehrávania: EQ hneď, obvod snímačov s krátkym oneskorením
let firTimer=null, strTimer=null;
const strKey=()=>JSON.stringify([S.mi,S.gauge,S.tuning||"E",S.slots,S.sel]);
// struny / snímače / ladenie sa zmenili počas hrania → prepočítaj struny a plynule prelož od aktuálneho miesta
function restring(){
  strTimer=null; if(!playing||!ctx) return;
  const key=strKey(); if(key===playing.skey) return;
  const pl=playing; pl.skey=key;
  let buf; try{ buf=renderStrings(pl.ev,pl.dur); }catch(e){ return; }
  if(playing!==pl) return;
  const now=ctx.currentTime, off=now-pl.t0;
  if(off>=pl.dur-.05) return;
  const src=ctx.createBufferSource(); src.buffer=buf;
  const g=ctx.createGain(); g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(1,now+.09);
  src.connect(g); g.connect(pl.inG); src.start(now,off);
  const os=pl.src, og=pl.srcG;
  og.gain.cancelScheduledValues(now); og.gain.setValueAtTime(og.gain.value,now); og.gain.linearRampToValueAtTime(0,now+.09);
  os.onended=null; try{ os.stop(now+.12); }catch(e){}
  setTimeout(()=>{ try{ og.disconnect(); }catch(e){} },300);
  pl.src=src; pl.srcG=g;
  src.onended=()=>{ if(playing===pl && pl.src===src){ playing=null; updatePlayBtns(); } };
}
function updatePlayBtns(){
  [["pChord","chord"],["pRiff","riff"]].forEach(([id,k])=>{ const b=document.getElementById(id); if(!b) return;
    const on=!!(playing&&playing.kind===k); b.textContent=t(on?"stop":k); b.setAttribute("aria-pressed",String(on)); });
}
function stopPlay(){
  if(!playing||!ctx) return; const pl=playing; playing=null;
  try{ pl.out.gain.cancelScheduledValues(ctx.currentTime); pl.out.gain.setTargetAtTime(0,ctx.currentTime,.03); pl.src.stop(ctx.currentTime+.2); }catch(e){}
  updatePlayBtns();
}
function liveUpdate(){
  if(!playing||!ctx||ctx.currentTime>playing.end) return;
  const now=ctx.currentTime;
  EQ.forEach((b,k)=>{ const n=playing.eqN[k]; if(!n) return; n.frequency.cancelScheduledValues(now); n.gain.cancelScheduledValues(now); n.frequency.setTargetAtTime(b.f,now,.06); n.gain.setTargetAtTime(b.g,now,.06); });
  if(strKey()!==playing.skey && !strTimer) strTimer=setTimeout(restring,220);
  if(firTimer) return;
  firTimer=setTimeout(()=>{ firTimer=null; if(!playing) return; const a=analyse();
    const key=JSON.stringify(a.c)+"|"+S.vol;
    if(key===playing.key) return;           // ťahanie EQ obvod nemení → žiadna výmena filtra
    playing.key=key;
    const t0=ctx.currentTime;
    playing.inG.gain.setTargetAtTime(S.vol>0?Math.min(2.4,Math.pow(10,a.outDb/20)):0,t0,.05);
    try{ const nf=ctx.createConvolver(); nf.normalize=false; nf.buffer=circuitFIR(a);
      const ng=ctx.createGain(); ng.gain.setValueAtTime(0,t0); ng.gain.linearRampToValueAtTime(1,t0+.12);
      playing.inG.connect(nf); nf.connect(ng); ng.connect(playing.eqN[0]);
      const old=playing.fir, og=playing.firG;
      og.gain.cancelScheduledValues(t0); og.gain.setValueAtTime(og.gain.value,t0); og.gain.linearRampToValueAtTime(0,t0+.12);
      playing.fir=nf; playing.firG=ng;
      setTimeout(()=>{ try{ old.disconnect(); og.disconnect(); }catch(e){} },300);
    }catch(e){} },180);
}
function play(kind){
  if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } }
  if(ctx.state==="suspended") ctx.resume();
  if(!verbIR) verbIR=makeIR();
  if(playing && playing.kind===kind && ctx.currentTime<playing.end){ stopPlay(); return; }
  if(playing){ const op=playing; playing=null; try{ op.out.gain.setTargetAtTime(0,ctx.currentTime,.03); op.src.stop(ctx.currentTime+.2); }catch(e){} }
  const a=analyse(); if(S.vol<=0){ updatePlayBtns(); return; }
  const {ev,dur}=events(kind);
  const src=ctx.createBufferSource(); src.buffer=renderStrings(ev,dur);
  const srcG=ctx.createGain(); srcG.gain.value=1;
  const lin=Math.pow(10,a.outDb/20);
  const inG=ctx.createGain(); inG.gain.value=Math.min(2.4,lin);
  const fir=ctx.createConvolver(); fir.normalize=false; fir.buffer=circuitFIR(a);
  const firG=ctx.createGain(); firG.gain.value=1;
  const eqN=EQ.map(b=>biq(b.type,b.f,b.type==="peaking"?b.q:.71,b.g));
  src.connect(srcG); let last=chain([srcG,inG,fir,firG,...eqN]);
  const bd=M().body;
  if(bd!=="solid") last=chain([last,biq("peaking",bd==="hollow"?190:240,1.1,bd==="hollow"?5:2.5),biq("peaking",1800,1,bd==="hollow"?-4:-1.5),biq("lowpass",bd==="hollow"?4200:6500,.7)]);
  if(amp==="crunch"){
    last=chain([last,biq("highpass",110,.7),(()=>{const g=ctx.createGain(); g.gain.value=5.5; return g;})(),shaper(3.2,.15),biq("peaking",850,.8,3),biq("highshelf",3200,null,-2)]);
  } else {
    last=chain([last,(()=>{const g=ctx.createGain(); g.gain.value=1.3; return g;})(),shaper(1.15,.06),biq("lowshelf",130,null,2.5),biq("peaking",700,.7,-2.5),biq("highshelf",3200,null,2)]);
  }
  // reprobox 1×12
  last=chain([last,biq("highpass",75,.7),biq("peaking",120,1,2),biq("peaking",2400,1.2,2.5),biq("lowpass",amp==="crunch"?4600:5800,.75)]);
  const dry=ctx.createGain(); dry.gain.value=1;
  const wet=ctx.createGain(); wet.gain.value=amp==="crunch"?.16:.24;
  const verb=ctx.createConvolver(); verb.buffer=verbIR;
  const out=ctx.createGain(); out.gain.value=amp==="crunch"?.32:.6;
  last.connect(dry); dry.connect(out); last.connect(verb); verb.connect(wet); wet.connect(out);   // limiter – pri veľkom zdvihu EQ nedovolí pretečenie (chrčanie)
  const lim=ctx.createDynamicsCompressor(); lim.threshold.value=-6; lim.knee.value=6; lim.ratio.value=20; lim.attack.value=.002; lim.release.value=.15;
  out.connect(lim); lim.connect(ctx.destination);
  src.start();
  const key=JSON.stringify(a.c)+"|"+S.vol;
  const t0=ctx.currentTime;
  playing={src,srcG,out,inG,fir,firG,eqN,key,kind,ev,dur,t0,skey:strKey(),end:t0+dur};
  const pl=playing;
  src.onended=()=>{ if(playing===pl && pl.src===src){ playing=null; updatePlayBtns(); } };
  updatePlayBtns();
  const sg=document.getElementById("strings"); if(sg){ sg.classList.add("str-ring"); setTimeout(()=>sg.classList.remove("str-ring"),1600); }
}
document.getElementById("pChord").addEventListener("click",()=>play("chord"));
document.getElementById("pRiff").addEventListener("click",()=>play("riff"));
(()=>{
  const svg=document.getElementById("chart"); let drag=null;
