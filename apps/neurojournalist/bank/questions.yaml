# Образцы сильных вопросов для «Нейрожурналиста», версия 0.3.
#
# Это не переводы: каждый вопрос переформулирован по-русски под разговор с джазовым
# музыкантом. Источник и номер показывают, где взята идея (номера см. в sources.yaml, поле numbering).
# {в скобках} то, что подставляется из досье.
# Поля: id, q (вопрос), technique (код приёма из techniques.yaml), theme, src, ref, note.

version: "0.3"
updated: "2026-11-12"

# Разделы (темы-кандидаты для плана интервью); взяты из присланного банка v0.1.
topics:
  T01: "Первое слышание и музыкальная память"
  T02: "Учителя, наследование, разрыв"
  T03: "Практика, дисциплина, мастерство"
  T04: "Личный язык, стиль и художественное решение"
  T05: "Разговор через конкретную запись"
  T06: "Импровизация, время и неопределённость"
  T07: "Ансамбль, власть и слушание"
  T08: "Ошибка, стыд, уязвимость и риск"
  T09: "Чувство, переживание и личная правда"
  T10: "Сцена, публика и живое присутствие"
  T11: "Тишина, звук и пределы выразительности"
  T12: "Композиция, форма, редактура"
  T13: "Повороты, изменения, внутренние противоречия"
  T14: "Традиция, культура, эпоха и коммерция"
  T15: "Нейроискусство, авторство и подлинность"
  T16: "Наследие, неизвестное и заключительное открытие"

# Условия применения вопроса.
preconditions:
  fact: выбрать конкретный факт или предмет разговора; не задавать вопрос только ради раздела
  skip: дать право пропустить; не предполагать травмы, вины или определённой позиции
  audio: запись подтверждена и действительно прослушана; таймкод проверен; слуховой факт отделён от толкования
  partners: известны конкретные партнёры, выступления и задокументированные совместные работы
  quote: точная цитата, дата, первоисточник и контекст подтверждены

