diatessin:{
 ru:["Этот бизнес, который основан в Гордевио (в долине Маджия), был создан Bruno Vanetti в 1968 году, и начиная с 1995 года компания была преобразована в общество с ограниченной ответственностью, а руководителем стал его сын Pablo, который работал в семейной фирме рядом со своим отцом с 1987 года.","Компания специализируется на производстве технических инструментов для хирургической стоматологии и в первые годы своего существования в основном активно работала на швейцарском и итальянском рынках.","С 1990 года, особенно после того, как Pablo Vanetti был вовлечён в управление, компания постепенно расширила свой рынок, достигнув международного размаха.","Сегодня продукция под брендом Dia Tessin продаётся не только в Швейцарии и Италии, но и в следующих странах:"],
 hy:["Գորդևիոյում (Մաջիա հովտում) գործող այս բիզնեսը հիմնադրել է Բրունո Վանետին 1968 թվականին։ 1995 թվականից ընկերությունը վերակազմավորվել է սահմանափակ պատասխանատվությամբ ընկերության, և այն ղեկավարում է նրա որդին՝ Պաբլոն, ով 1987 թվականից աշխատում էր ընտանեկան ընկերությունում հոր կողքին։","Ընկերությունը մասնագիտացած է վիրաբուժական ստոմատոլոգիայի տեխնիկական գործիքների արտադրության մեջ և առաջին տարիներին հիմնականում աշխատում էր շվեյցարական և իտալական շուկաներում։","1990 թվականից, հատկապես Պաբլո Վանետիի՝ ղեկավարմանը ներգրավվելուց հետո, ընկերությունն աստիճանաբար ընդլայնեց իր շուկան՝ հասնելով միջազգային մասշտաբի։","Այսօր Dia Tessin ապրանքանիշի արտադրանքը վաճառվում է ոչ միայն Շվեյցարիայում և Իտալիայում, այլև հետևյալ երկրներում՝"],
 en:["Founded in Gordevio, in the Maggia Valley, by Bruno Vanetti in 1968, the business became a limited company in 1995 and has since been run by his son Pablo, who had worked alongside his father in the family firm since 1987.","The company makes technical instruments for dental surgery, and in its early years worked mainly in the Swiss and Italian markets.","From 1990, especially after Pablo Vanetti joined the management, it gradually expanded and reached an international scale.","Today Dia Tessin products are sold not only in Switzerland and Italy but also in the following countries:"]},
trihawk:{
 ru:["Уважаемые Доктора, Вашему вниманию предлагаются уникальные стоматологические боры канадской фирмы TriHawk. Предлагаемая линейка боров включает в себя твердосплавные (карбид вольфрама) боры серии Talon для разрезания цельнолитых металлокерамических коронок, стандартные карбидные и алмазные боры.","Боры TriHawk не похожи ни на один из тех, которыми вам доводилось пользоваться раньше. Они характеризуются уникальными особенностями конструкции, уникальными комбинациями металлов и уникальной технологией сварки.","Одним словом, боры TriHawk предназначены для специалистов высокого уровня."],
 hy:["Հարգելի բժիշկներ, ներկայացնում ենք կանադական TriHawk ընկերության եզակի ստոմատոլոգիական բորերը։ Տեսականին ներառում է Talon շարքի կարծր համաձուլվածքից (վոլֆրամի կարբիդ) բորեր՝ ամբողջաձույլ մետաղակերամիկական պսակներ կտրելու համար, ինչպես նաև ստանդարտ կարբիդային և ալմաստե բորեր։","TriHawk բորերը նման չեն ձեր նախկինում օգտագործած որևէ բորի։ Դրանք առանձնանում են եզակի կառուցվածքով, մետաղների եզակի համակցություններով և զոդման եզակի տեխնոլոգիայով։","Մի խոսքով՝ TriHawk բորերը նախատեսված են բարձր մակարդակի մասնագետների համար։"],
 en:["Dear Doctors, we present the unique dental burs of the Canadian company TriHawk. The range includes Talon tungsten carbide burs for cutting through solid-cast metal-ceramic crowns, as well as standard carbide and diamond burs.","TriHawk burs are unlike any you have used before. They stand out for their unique design, unique metal combinations and unique welding technology.","In a word, TriHawk burs are made for high-level specialists."]}};

function play(sl){if(!sl)return;sl.classList.remove("play");void sl.offsetWidth;sl.classList.add("play");}
const SL={i:0,busy:false,timer:null,fx:0,dur:9000};
function slTabs(){$$(".hs-tab").forEach((tb,k)=>{tb.classList.remove("on");if(k===SL.i){void tb.offsetWidth;tb.classList.add("on");}});const on=$$(".hs-tab")[SL.i];const tabs=$("#tabs");if(on&&tabs)tabs.scrollTo({left:on.offsetLeft-tabs.clientWidth/2+on.clientWidth/2,behavior:reduce?"auto":"smooth"});}
function slArm(){clearTimeout(SL.timer);SL.timer=setTimeout(()=>slGo(SL.i+1),SL.dur);}
function tilesPath(w,h,cols,rows,prog,mode){let d="";const cw=w/cols,ch=h/rows;
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){let delay;
  if(mode==="chess")delay=((r+c)%2?0.45:0)+((r+c)/(cols+rows))*0.35;else delay=(c/cols)*0.6;
  let p=Math.min(1,Math.max(0,(prog-delay)/0.4));if(p<=0)continue;p=1-Math.pow(1-p,3);
  let x,y,ww,hh;if(mode==="chess"){ww=cw*p;hh=ch*p;x=c*cw+(cw-ww)/2;y=r*ch+(ch-hh)/2;}else{ww=cw*p+0.6;hh=h;x=c*cw;y=0;}
  d+=`M${x.toFixed(1)} ${y.toFixed(1)}h${ww.toFixed(1)}v${hh.toFixed(1)}h${(-ww).toFixed(1)}z`;}
 return d||"M0 0h0v0z";}
function slGo(n,dirHint){const stage=$("#stage");if(!stage||SL.busy)return;const sl=$$(".hs",stage),N=sl.length;n=(n+N)%N;if(n===SL.i)return;
 const from=sl[SL.i],to=sl[n],dir=dirHint||(n>SL.i||(SL.i===N-1&&n===0)?1:-1);const small=matchMedia("(max-width:759px)").matches;const fx=reduce?"fade":(SL.swipe||small)?(SL.swipe?"slide":["fade","slide"][SL.fx%2]):FX[SL.fx%FX.length];SL.fx++;SL.swipe=false;SL.busy=true;
 if(fx==="fade")to.classList.add("prep");to.setAttribute("aria-hidden","false");from.setAttribute("aria-hidden","true");
 const done=()=>{from.classList.remove("cur","under","top","out","play");from.style.cssText="";to.classList.remove("inc","under","top");to.classList.add("cur");to.style.cssText=to.style.cssText.replace(/clip-path[^;]*;?/g,"").replace(/transform[^;]*;?/g,"").replace(/opacity[^;]*;?/g,"");to.style.clipPath="";to.style.transform="";to.style.opacity="";
  requestAnimationFrame(()=>to.classList.remove("prep"));SL.busy=false;};
 SL.i=n;slTabs();slArm();from.classList.add("out");play(to);
 const W=stage.clientWidth,H=stage.clientHeight;
 if(fx==="fade"){to.classList.add("inc");to.animate([{opacity:0},{opacity:1}],{duration:900,easing:"ease"}).onfinish=done;}
 else if(fx==="slide"){to.classList.add("inc");from.animate([{transform:"translateX(0)"},{transform:`translateX(${-dir*100}%)`}],{duration:900,easing:"cubic-bezier(.7,0,.2,1)"});to.animate([{transform:`translateX(${dir*100}%)`},{transform:"translateX(0)"}],{duration:900,easing:"cubic-bezier(.7,0,.2,1)"}).onfinish=done;}
 else if(fx==="pull"){from.classList.add("top");to.classList.add("under");from.style.transformOrigin=dir>0?"0% 100%":"100% 100%";from.style.boxShadow="0 30px 60px rgba(0,0,0,.25)";
  to.animate([{transform:"scale(.94)",opacity:.6},{transform:"scale(1)",opacity:1}],{duration:1100,easing:"cubic-bezier(.3,0,.2,1)"});
  from.animate([{transform:"translate(0,0) rotate(0)"},{transform:`translate(${dir*2.5}%,-1%) rotate(${dir*1.2}deg)`,offset:.18},{transform:`translate(${-dir*115}%,4%) rotate(${-dir*7}deg)`}],{duration:1100,easing:"cubic-bezier(.5,0,.75,0)"}).onfinish=()=>{from.style.boxShadow="";from.style.transformOrigin="";done();};}
 else{to.classList.add("inc");const cols=fx==="chess"?(W>900?8:5):(W>900?12:7),rows=fx==="chess"?Math.max(3,Math.round(H/(W/cols))):1,T=fx==="chess"?1300:1000,t0=performance.now();to.style.clipPath="path('M0 0h0v0z')";
  const step=now=>{const pr=Math.min(1,(now-t0)/T)*1.0;to.style.clipPath=`path('${tilesPath(W,H,cols,rows,pr*1.0,fx)}')`;if(pr<1)requestAnimationFrame(step);else{to.style.clipPath="";done();}};requestAnimationFrame(step);}
}
function initSlider(){const st=$("#stage");if(!st)return;SL.i=0;SL.busy=false;requestAnimationFrame(()=>play($(".hs.cur",st)));document.documentElement.style.setProperty("--dur",SL.dur+"ms");slArm();
 let x0=null,y0=null,moved=false;
 st.addEventListener("touchstart",e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;moved=false;},{passive:true});
 st.addEventListener("touchmove",e=>{if(x0==null)return;const t=e.touches[0];if(Math.abs(t.clientX-x0)>10)moved=true;},{passive:true});
 st.addEventListener("touchend",e=>{if(x0==null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.2){SL.swipe=true;slGo(SL.i+(dx<0?1:-1),dx<0?1:-1);}});
 let mx=null;st.addEventListener("mousedown",e=>{mx=e.clientX});st.addEventListener("mouseup",e=>{if(mx==null)return;const dx=e.clientX-mx;mx=null;if(Math.abs(dx)>50){moved=true;slGo(SL.i+(dx<0?1:-1),dx<0?1:-1);setTimeout(()=>moved=false,50);}});
 st.addEventListener("click",e=>{if(moved){moved=false;return;}if(e.target.closest("a,button"))return;const a=$(".hs.cur .hx-acts a",st);if(!a)return;if(a.target==="_blank")window.open(a.href,"_blank","noopener");else location.hash=a.getAttribute("href");});}
